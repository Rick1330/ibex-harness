[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authclient"
version = "0.1.5"
description = "Shared AuthService.ValidateToken wire codec, trust gates, and dial client for Python services"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
grpc = ["grpcio>=1.60,<2"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "grpcio>=1.60,<2",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["authclient*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
