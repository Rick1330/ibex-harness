[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-descriptors"
version = "0.1.0"
description = "Shared, checkable record of a published MCP tool surface for the IBEX MCP services (W5.5 / P0-14)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.29.1,<2",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mcp_tool_descriptors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
