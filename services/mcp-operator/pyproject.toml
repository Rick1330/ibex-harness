[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibex-mcp-operator"
version = "0.1.0"
description = "IBEX Harness read-only MCP operator gateway (GAP-009); default-off FastMCP surface over packages/mcp_gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "authclient",
  "mcp-gateway",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "httpx>=0.27.0",
  "grpcio>=1.62.0",
  "prometheus-client>=0.20.0",
  "redis>=5.0.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "ibex-async-db",
  # Latest PyPI 1.x; do not float to mcp 2.x (matches services/mcp-memory).
  "mcp>=1.29.1,<2",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: requires a live PostgreSQL database",
  "iso_operator: cross-tenant isolation matrix against a live database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
authclient = { path = "../../packages/authclient" }
mcp-gateway = { path = "../../packages/mcp_gateway" }
ibex-async-db = { path = "../../packages/ibex_async_db" }

[dependency-groups]
dev = [
  "pytest-asyncio>=1.4.0",
]
