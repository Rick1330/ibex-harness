[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibex-mcp-memory"
version = "0.1.0"
description = "IBEX Harness MCP memory resource server (G6.M1 skeleton — stub tools)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "httpx>=0.27.0",
  "grpcio>=1.62.0",
  "prometheus-client>=0.20.0",
  "mcp>=1.12.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: requires optional live dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
omit = ["app/stdio_main.py"]

[dependency-groups]
dev = [
  "pytest-asyncio>=1.4.0",
]
