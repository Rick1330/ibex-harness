[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibex-worker"
version = "0.1.0"
description = "IBEX Harness Celery worker (extraction, embedding, maintenance, mcp_audit)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ibex-async-db",
  "celery>=5.4,<6",
  "kombu>=5.4,<6",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "redis>=5.0.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
  "prometheus-client>=0.20.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: requires live Redis broker/result backend",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
source = ["app"]
omit = [
  "app/__init__.py",
]

[tool.coverage.report]
fail_under = 90

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
ibex-async-db = { path = "../../packages/ibex_async_db" }
