coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 95%
  ignore:
    - "packages/proto/gen/go/**"
    # Playwright/E2E harness binaries (not production code).
    - "services/proxy/cmd/hardcap-deny-fixture/**"
    - "services/**/cmd/**-fixture/**"
    # Integration-only test harness (build tag `integration`); exercised by the
    # relay-integration job but not instrumented by the coverage profile.
    - "services/relay/internal/relaytest/**"
  flags:
    go:
      paths:
        - packages/
        - services/
    embedder:
      paths:
        - services/embedder/app/
    context:
      paths:
        - services/context/app/
