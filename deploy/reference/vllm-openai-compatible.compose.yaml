# REFERENCE ONLY — not required for proxy CI or make compose-dev-up.
# Example OpenAI-compatible vLLM endpoint for IBEX_SELFHOSTED_* local experiments.
# See ADR-0042 and milestone 2.5.G1.M3.
#
# Usage (operator machine with GPU / compatible runtime):
#   docker compose -f deploy/reference/vllm-openai-compatible.compose.yaml up
# Then point proxy at:
#   IBEX_SELFHOSTED_ENABLED=true
#   IBEX_SELFHOSTED_BASE_URL=http://127.0.0.1:8000/v1
#   IBEX_SELFHOSTED_MODELS=<served-model-id>
#   IBEX_MODEL_CAPABILITY_OVERLAYS=[...]

services:
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    environment:
      # Replace with a model your host can load.
      MODEL: ${VLLM_MODEL:-facebook/opt-125m}
    command:
      - "--model"
      - "${VLLM_MODEL:-facebook/opt-125m}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    # Uncomment when a GPU is available:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
