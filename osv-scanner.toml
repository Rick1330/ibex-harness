# OSV ignore policy: advisory-scoped, expiring, and limited to dependency
# chains that are build-time or development-only and have no compatible fixed
# release. A package that reaches the deployed artifact must not be ignored.

# zod patch advisory (GHSA-mrhx-c7xc-m3w5): fixed only in zod 4.6.6, which the
# shadcn CLI (console devDependency) cannot take because it targets zod v3.
# The zod 4.x instance in the lockfile is already >=4.6.6, so the ignore only
# silences the shadcn-carried 3.x copy in console development tooling.
[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2026-12-01
reason = "Fix exists only in zod 4.6.6+ (already installed for direct zod 4 consumers); the remaining 3.x instance is carried by the shadcn CLI devDependency and cannot take the major bump."

