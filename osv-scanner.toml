# Scorecard/OSV: golang.org/x/crypto module-level openpgp advisory (GO-2026-5932).
# This repo imports only argon2 via packages/crypto (ADR-0010). govulncheck
# confirms no reachable impact; see ADR-0008.

[[IgnoredVulns]]
id = "GO-2026-5932"
# Revisit when golang.org/x/crypto publishes a fixed openpgp release or we drop the module.
ignoreUntil = 2026-12-01
reason = "Unreachable openpgp subpackage; only golang.org/x/crypto/argon2 is used (ADR-0008, ADR-0010). Verified by govulncheck."

# image-size DoS in JXL/HEIF/ICNS parsers (Dependabot alerts #24 / #25):
# no patched release (advisory last-affected 2.0.2; npm latest still 2.0.2).
# Transitive via fumadocs-core; docs site does not parse untrusted image buffers
# through image-size. Prefer package-scoped ignore over global advisory IDs.

[[PackageOverrides]]
name = "image-size"
version = "1.2.1"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-12-01
reason = "No patched image-size npm release (<=2.0.2). Transitive fumadocs-core@14; pnpm patch applies ICNS/JXL loop guards (patches/image-size@1.2.1.patch); docs build does not feed untrusted buffers (Dependabot #24/#25). Revisit when upstream publishes or fumadocs drops the dep."

# braces stack-exhaustion advisory (GHSA-vfj7-8cjw-p6xm): npm has no patched
# release (OSV reports fixed version "--"). It is reachable only through
# console development tooling (eslint-config-next and shadcn), not production
# dependencies. Revisit when the upstream dependency chain publishes a fix.
[[PackageOverrides]]
name = "braces"
version = "3.0.3"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-12-01
reason = "No upstream fixed release; reachable only through console devDependencies eslint-config-next/shadcn; excluded from production audit."
