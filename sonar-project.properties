# SonarCloud analysis scope (see https://docs.sonarcloud.io/advanced-setup/analysis-scope/)
sonar.python.version=3.12
sonar.exclusions=**/tests/**,**/*_test.go,**/test_*.py
sonar.test.exclusions=**/tests/**,**/*_test.go,**/test_*.py
sonar.coverage.exclusions=**/tests/**,**/*_test.go,**/test_*.py,**/gen/**
# Org GUC helper still mirrors memory until a shared DB helper lands; single-line
# globs — multiline backslash continuations are not reliably applied.
sonar.cpd.exclusions=**/services/api/app/db.py
