title = "IBEX Harness gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''\.env\.example$''',
  '''docs/ENVIRONMENT_VARIABLES\.md''',
  '''site/content/docs/.*\.md$''',
  '''prompts/''',
  '''services/proxy/internal/auth/validator_test\.go''',
  # Generated Nuxt dev output. It is gitignored and never source; local agent
  # checkpoint refs can still contain it, which would otherwise fail a full
  # local `gitleaks detect`.
  '''services/console/\.nuxt/''',
]
regexes = [
  '''key: "agent_billing"''',
  '''idempotency_key: "preview-idempotency-01"''',
  '''idempotencyKey: "pol-publish-2026-10-27-03"''',
  '''pol-publish-2026-10-27-03''',
  '''agent_billing''',
  '''preview-idempotency-01''',
  # bundle-smoke.sh uses two fixed, non-secret idempotency keys. The
  # curl-auth-header rule treats the header value as a credential; allowlist
  # only those exact values, with token boundaries, so a real credential that
  # merely contains this text is still reported.
  '''\bbundle-smoke-create-[12]\b''',
  # ADR-0096 caller-auth fixtures. Both are synthetic placeholders reused by the
  # unit and integration tests (one is a repeated hex pattern, one exercises the
  # hyphen/underscore charset); neither is a credential. Allowlist the exact
  # values so a real key that merely contains them is still reported.
  '''\b0123456789abcdef0123456789abcdef\b''',
  '''\bABCDEFGHIJ_KLMNOPQRST-UVWXYZ012345\b''',
  # The G0 review packet describes the policy-snapshot signature as
  # "RS256-signed". gitleaks' generic-api-key heuristic matches that hyphenated
  # phrase; it is a documentation adjective, not a credential.
  '''\bRS256-signed\b''',
  # infra/scripts/test-ci-tiering.sh used to prove its filter matcher with
  #   glob_matches 'infra/scripts/api-*.sh' 'infra/scripts/api-breaking.sh' || matcher_ok=0
  # generic-api-key reads `api` as the keyword, the quoted path as the key, `||` as
  # the separator and the shell assignment as a 12-character value, so it reports the
  # line as a credential. The fixture no longer has that shape in the tree, but the
  # commit that introduced it is still in history and `gitleaks detect` scans
  # history. Allowlist the exact value, anchored to the whole extracted secret: a
  # longer secret that contains this text — `matcher_ok=0.abcdef…` among them — is a
  # different value and is still reported.
  '''^matcher_ok=0$''',
  # infra/scripts/test_redact_container_logs.py pins the log-redaction filter with
  # fictional credential-shaped fixtures. Its "credential inside a nested error
  # string" case carries
  #   {"level":"ERROR","error":"dial tcp: auth failed token=sk-live-abc123"}
  # generic-api-key reads `token` as the keyword and `sk-live-abc123` as the
  # value. The fixture is composed from fragments in the tree now, but the commit
  # that introduced it (724bc045) is still in history and `gitleaks detect` scans
  # history. Allowlist the exact value, anchored to the whole extracted secret: a
  # longer secret that contains this text — `sk-live-abc123def` among them — is a
  # different value and is still reported. This is a value, not a path: a real
  # credential written into that file later is still reported.
  '''^sk-live-abc123$''',
]
