---
# Docs migration scripts live in ibex-harness-workspace/docs-app-scripts (outside repo).
# Wave 14 dev/build helper scripts use validated spawnSync (shell:false, absolute paths).
exclude_paths:
  # D0 is a preview-only visual transplant; production contracts are gated before enablement.
  - "services/console/**"
  - "site/scripts/**"
  - ".github/tools/licenses/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.mjs"
  # Pytest uses assert for expectations; Codacy flags S101/Bandit B101 in test bodies.
  - "services/**/tests/**"
  - "packages/**/tests/**"
  - "infra/tests/**"
  # Codacy .codacy.yml exclude_paths can only ignore whole files/globs, not a
  # single finding. The Opengrep SSRF false positive on the allowlisted
  # fetch() in services/console/src/lib/api/transport.ts is suppressed inline
  # with `// nosemgrep` at the call site (origin=server env, path=allowlist).
  # Plan-gate / benchmark helpers use static parameterized SQL outside app/ hot paths
  # (see benchmarks/memory/README.md — not production request handlers).
  - "benchmarks/memory/**"
  # Go test files. Every site below is already gated locally by golangci-lint and
  # .semgrep/rules/, and most carry inline `// nosemgrep` that Codacy's Opengrep
  # ignores. The open findings were all false positives on test scaffolding: an
  # in-process gRPC server without TLS, parameterised fixture SQL, a re-exec of
  # the test binary, and an httptest body write. Test files never ship in a
  # runtime image. This replaces the per-file list that had grown here.
  - "**/*_test.go"
  # `//go:build integration` fixtures only; seeded rows and SQL-file runners.
  - "infra/testing/**"
  # ClickHouse / Postgres migrations are not T-SQL. Codacy still runs TSQLLint
  # on *.sql despite engines.tsqllint.enabled=false; SET QUOTED_IDENTIFIER would
  # break golang-migrate, so exclude all migration SQL.
  - "infra/migrations/postgres/*.sql"
  - "infra/migrations/clickhouse/*.sql"
  # ClickHouse query goldens (toStartOfHour / countIf / ?) are not T-SQL.
  - "packages/usagequery/testdata/**"

# Postgres migrations are not T-SQL; disable the T-SQL-only engine.
engines:
  tsqllint:
    enabled: false
  # Codacy's bundled ESLint enables eslint-plugin-security, whose heuristics fire
  # on any computed member access and on any `x !== y` between two variables. The
  # flagged sites are bounded numeric indexing into a local array/record with a
  # `??` fallback, and a monotonic render-race counter (`token !== requestToken`).
  # None of them has an attacker-controlled key or a secret on either side. The
  # rules are not part of the repository's own ESLint config, so the findings
  # cannot be reproduced or triaged locally; excluding ESLint here keeps the
  # repository's real lint signal (correctness, style, complexity) intact.
  eslint-8:
    exclude_paths:
      - "site/app/components/BenchmarkChart.vue"
      - "site/app/components/content/MermaidDiagram.vue"
      - "site/app/components/landing/LandingCodeTabs.vue"
      - "site/app/composables/useMermaidDiagram.ts"
      - "site/app/pages/benchmarks.vue"
      - "site/app/utils/series.ts"
  # Mermaid sanitises the SVG it generates with its own bundled DOMPurify, and
  # both components initialise it with `securityLevel: 'strict'`, which encodes
  # HTML in labels and disables click handlers (mermaid docs: config/usage).
  # The diagram source is repository-authored content, never user input, so the
  # v-html sink receives already-sanitised markup. Adding DOMPurify here would
  # sanitise the same string twice for no gain.
  opengrep:
    exclude_paths:
      - "site/app/components/content/MermaidDiagram.vue"
      - "site/app/components/DiagramViewer.vue"
