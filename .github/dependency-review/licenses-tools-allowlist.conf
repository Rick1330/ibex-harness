# Scoped advisory allowlist for dependency-review only.
# Format: SCOPED_EXCEPTIONS entries of "manifest|package|version|GHSA,..."
# Each entry is pinned to one manifest, one package, and one exact version;
# an entry stops applying the moment the package or manifest changes, so it
# cannot silently cover an upgrade. Every entry needs a documented reason and
# a re-audit when the pinned dependency chain changes, matching the
# osv-scanner.toml ignore policy for the same advisory.

SCOPED_EXCEPTIONS=(
  # 1. go-licenses CI lockfile: go-git v4 is pinned by go-licenses and has no
  #    fixed v4 release; the listed GHSAs are why it is quarantined to a
  #    tools-only manifest that never ships. Re-audit on go-licenses upgrades
  #    or when it no longer depends on go-git v4.
  ".github/tools/licenses/go.mod|gopkg.in/src-d/go-git.v4|4.13.1|GHSA-449p-3h89-pw88,GHSA-v725-9546-7q7m,GHSA-mw99-9chc-xw7r,GHSA-r9px-m959-cxf4"
  # 2. Site pnpm lockfile: node-forge@1.4.0 (GHSA-86w9-cpqp-85rv) has no
  #    patched release; it is reachable only through the listhen dev-server
  #    dependency and is absent from the deployed static output. Mirrors the
  #    GHSA-86w9-cpqp-85rv entry in osv-scanner.toml. Re-audit when listhen
  #    drops or patches node-forge.
  "pnpm-lock.yaml|node-forge|1.4.0|GHSA-86w9-cpqp-85rv"
)
