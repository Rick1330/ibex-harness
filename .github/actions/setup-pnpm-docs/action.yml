name: Setup pnpm (docs monorepo)
description: Node 20 with pnpm store cache and corepack activation

runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "20"
        cache: pnpm

    - name: Enable corepack (pnpm)
      shell: bash
      run: corepack enable && corepack prepare pnpm@9.15.9 --activate
