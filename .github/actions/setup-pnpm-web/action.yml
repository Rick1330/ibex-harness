name: Setup pnpm (web app)
description: Node 20 with pnpm store cache

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      with:
        version: 9.15.9

    - uses: actions/setup-node@48b55a011bda9f5d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"
        cache: pnpm

    - name: Install web workspace dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm --filter web run postinstall
