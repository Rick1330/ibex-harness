name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.json'
      - '.github/scripts/sync-github-labels.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: sync-labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync label colors and descriptions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/sync-github-labels.sh
