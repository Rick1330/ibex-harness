      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs
        working-directory: packages/proto
        run: buf generate
      - name: Phase 3 memory HTTP lifecycle e2e (m3.E.2)
        env:
          POSTGRES_DSN: postgres://ibex:ibex@localhost:5432/ibex?sslmode=disable
          POSTGRES_MIGRATE_DSN: postgres://ibex:ibex@localhost:5432/ibex?sslmode=disable
        run: bash infra/scripts/memory-e2e-test-ci.sh

  verify-phase25:
    name: verify-phase25
    needs: changes
    if: needs.changes.outputs.run_go == 'true' || needs.changes.outputs.run_python == 'true' || needs.changes.outputs.run_compose == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs
        working-directory: packages/proto
        run: buf generate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Phase 2.5 exit gate (packages + Python; no live multi-service e2e)
        run: bash infra/scripts/verify_phase25.sh

  golangci-lint:
    name: golangci-lint
    needs: [changes, proto-contract]
    if: needs.changes.outputs.run_go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history + origin/main for issues.new-from-rev / whole-files.
          fetch-depth: 0
      - name: Ensure origin/main for complexity new-from-rev
        run: bash infra/scripts/ensure-origin-main.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs for auth
        working-directory: packages/proto
        run: buf generate
      - name: Install golangci-lint
        run: |
          GOLANGCI_LINT_VERSION=2.8.0
          GOLANGCI_LINT_ARCHIVE="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "${GOLANGCI_LINT_ARCHIVE}" \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${GOLANGCI_LINT_ARCHIVE}"
          curl --proto '=https' --tlsv1.2 -sSfL -o checksums.txt \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt"
          grep " ${GOLANGCI_LINT_ARCHIVE}$" checksums.txt | sha256sum -c -
          tar -xzf "${GOLANGCI_LINT_ARCHIVE}" -C /usr/local/bin --strip-components=1 \
            "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint"
          golangci-lint --version
      - name: Run golangci-lint (depguard — no grandfathering)
        run: |
          golangci-lint run --config .golangci.depguard.yml ./packages/...
      - name: Run golangci-lint (base linters)
        run: |
          golangci-lint run --config .golangci.yml ./packages/... ./services/auth/... ./services/proxy/...
      - name: Run golangci-lint (complexity — whole-files scoped)
        run: |
          golangci-lint run --config .golangci.complexity.yml ./packages/... ./services/auth/... ./services/proxy/...
  go-fuzz:
    name: go-fuzz
    needs: changes
    if: needs.changes.outputs.run_go == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run Go fuzz smoke (chat request parser)
        run: go test -fuzz=FuzzParseChatCompletionRequest -fuzztime=30s ./services/proxy/internal/llm/

  trivy:
    name: trivy
    needs: changes
    if: needs.changes.outputs.run_security == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.0
        with:
          version: v0.70.0
      - name: Run Trivy filesystem scan
        run: |
          set +e
          # Table first so failing CVEs are visible in job logs (SARIF alone is opaque).
          trivy fs . \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --format table \
            --exit-code 1
          table_rc=$?
          trivy fs . \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --format sarif \
            --output trivy-results.sarif \
            --exit-code 0
          sarif_rc=$?
          set -e
          if [ "$table_rc" -ne 0 ] || [ "$sarif_rc" -ne 0 ]; then
            exit 1
          fi
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  osv-scan:
    name: osv-scan
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.run_security == 'true'
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      # OSV scans JS lockfiles only. Go module vulnerabilities are enforced by
      # the govulncheck job (reachable-code analysis). GO-2026-5932 is a
      # module-level openpgp advisory with no fixed version; OSV flags
      # golang.org/x/crypto even when only argon2 is imported and call analysis
      # cannot mark it unexecuted. See ADR-0008.
      scan-args: |-
        --lockfile
        pnpm-lock.yaml

  web-build:
    name: web-build
    needs: [changes, repo-guards]
    if: needs.changes.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Overlay PR benchmark artifact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_id=""
          if ! run_id="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow benchmark.yml \
            --commit "${HEAD_SHA}" \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")] | first | .databaseId // empty' 2>/dev/null)"; then
            echo "Benchmark overlay lookup failed for ${HEAD_SHA}; using committed benchmark JSON."
            exit 0
          fi
          if [ -z "$run_id" ]; then
            echo "No successful Benchmarks run for ${HEAD_SHA}; using committed benchmark JSON."
            exit 0
          fi
          mkdir -p web/public/benchmarks
          if ! gh run download "$run_id" \
            --repo "${GITHUB_REPOSITORY}" \
            --name benchmark-data \
            --dir /tmp/benchmark-data; then
            echo "Benchmark artifact download failed for run ${run_id}; using committed benchmark JSON."
            exit 0
          fi
          cp /tmp/benchmark-data/benchmark-data.json web/public/benchmarks/benchmark-data.json
          if [ -f /tmp/benchmark-data/badge.svg ]; then
            cp /tmp/benchmark-data/badge.svg web/public/benchmarks/badge.svg
          fi
          echo "Overlaid benchmark artifact from run ${run_id}"

      - name: Overlay PR HNSW benchmark artifact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_id=""
          if ! run_id="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow memory-benchmark.yml \
            --commit "${HEAD_SHA}" \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")] | first | .databaseId // empty' 2>/dev/null)"; then
            echo "HNSW overlay lookup failed for ${HEAD_SHA}; using committed HNSW JSON."
            exit 0
          fi
          if [ -z "$run_id" ]; then
            echo "No successful Memory Benchmarks run for ${HEAD_SHA}; using committed HNSW JSON."
            exit 0
          fi
          mkdir -p web/public/benchmarks
          if ! gh run download "$run_id" \
            --repo "${GITHUB_REPOSITORY}" \
            --name hnsw-benchmark-data \
            --dir /tmp/hnsw-benchmark-data; then
            echo "HNSW artifact download failed for run ${run_id}; using committed HNSW JSON."
            exit 0
          fi
          cp /tmp/hnsw-benchmark-data/hnsw-benchmark-data.json \
            web/public/benchmarks/hnsw-benchmark-data.json
          echo "Overlaid HNSW artifact from run ${run_id}"
          if gh run download "$run_id" \
            --repo "${GITHUB_REPOSITORY}" \
            --name ranking-quality-benchmark-data \
            --dir /tmp/ranking-quality-benchmark-data 2>/dev/null; then
            cp /tmp/ranking-quality-benchmark-data/ranking-quality-benchmark-data.json \
              web/public/benchmarks/ranking-quality-benchmark-data.json
            echo "Overlaid ranking-quality artifact from run ${run_id}"
          fi
          if gh run download "$run_id" \
            --repo "${GITHUB_REPOSITORY}" \
            --name write-pipeline-benchmark-data \
            --dir /tmp/write-pipeline-benchmark-data 2>/dev/null; then
            cp /tmp/write-pipeline-benchmark-data/write-pipeline-benchmark-data.json \
              web/public/benchmarks/write-pipeline-benchmark-data.json
            echo "Overlaid write-pipeline artifact from run ${run_id}"
          fi

      - uses: ./.github/actions/setup-pnpm-web

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'web/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Typecheck web app
        run: pnpm --filter web typecheck

      - name: Test web components
        timeout-minutes: 3
        run: pnpm --filter web test

      - name: Build web app
        run: pnpm web:build:clean

  hadolint:
    name: hadolint
    needs: changes
    if: needs.changes.outputs.run_docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hadolint all Dockerfiles
        run: |
          # Dockerfiles today: services/auth, services/proxy, services/embedder, services/mcp-memory.
          # Pending: services/memory, services/dashboard (see web/engineering/DEPENDENCIES.md §10).
          mapfile -t files < <(find . -name 'Dockerfile*' -not -path './.git/*' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Dockerfiles found"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Linting $f"
            docker run --rm -i \
              -v "${GITHUB_WORKSPACE}:/workdir" \
              -w /workdir \
              hadolint/hadolint:v2.12.0 \
              hadolint -f tty --config .hadolint.yaml "$f"
          done

  coverage:
    name: coverage
    needs: [changes, proto-contract, db-migrate-smoke]
    if: needs.changes.outputs.run_go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        # pgvector 0.8.6 on PostgreSQL 16 — immutable pin of
        # pgvector/pgvector:0.8.6-pg16 (mutable :pg16 must not be used in CI).
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: ibex
          POSTGRES_PASSWORD: ibex
          POSTGRES_DB: ibex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ibex -d ibex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DSN: postgres://ibex:ibex@localhost:5432/ibex?sslmode=disable
      POSTGRES_MIGRATE_DSN: postgres://ibex:ibex@localhost:5432/ibex?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-gotestsum
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs
        working-directory: packages/proto
        run: buf generate
      - name: Migrate up
        run: go run ./infra/migrations/postgres/cmd/migrate -command up
      - name: Go unit coverage
        run: |
          bash infra/scripts/go-test-gotestsum.sh test-results/junit/coverage-unit.xml -- \
            -count=1 -coverprofile=coverage-go-unit.out \
            ./packages/... ./services/auth/... ./services/proxy/...
      - name: Upload test results to Trunk (coverage-unit)
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/trunk-upload-junit
        with:
          junit-paths: test-results/junit/coverage-unit.xml
          variant: coverage-unit
          org-slug: ${{ secrets.TRUNK_ORG_URL_SLUG }}
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      - name: Go integration coverage
        run: |
          bash infra/scripts/go-test-gotestsum.sh test-results/junit/coverage-integration.xml -- \
            -tags=integration -count=1 -p 1 -coverprofile=coverage-go-integration.out \
            ./packages/... ./services/auth/... ./services/proxy/... ./infra/...
      - name: Upload test results to Trunk (coverage-integration)
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/trunk-upload-junit
        with:
          junit-paths: test-results/junit/coverage-integration.xml
          variant: coverage-integration
          org-slug: ${{ secrets.TRUNK_ORG_URL_SLUG }}
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      - name: Merge coverage profiles
        run: |
          go run github.com/wadey/gocovmerge@v0.0.0-20160331181800-b5bfa59ec0ad \
            coverage-go-unit.out coverage-go-integration.out > coverage-go-merged.out
          bash infra/scripts/coverage-filter.sh coverage-go-merged.out coverage-go-handwritten.out
          go tool cover -func=coverage-go-handwritten.out | tail -1
      - name: Coverage gate
        run: bash infra/scripts/coverage-gate.sh coverage-go-merged.out
      - name: Upload coverage reports to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-go-handwritten.out,coverage-go-unit.out,coverage-go-integration.out
          flags: go,unit,integration
          fail_ci_if_error: false

