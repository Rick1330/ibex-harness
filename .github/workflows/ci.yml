    name: worker-coverage
    needs: changes
    if: needs.changes.outputs.run_go == 'true' || needs.changes.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Worker pytest coverage
        run: bash infra/scripts/worker-test-ci.sh
      - name: Worker coverage gate
        run: bash infra/scripts/coverage-worker-gate.sh
      - name: Upload coverage reports to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/worker/coverage-worker.xml
          flags: worker,python
          fail_ci_if_error: false

  bandit:
    name: bandit
    needs: changes
    if: needs.changes.outputs.run_security == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Bandit (Python services)
        id: bandit
        run: |
          targets=()
          for svc in memory embedder mcp-memory worker; do
            app_dir="services/${svc}/app"
            if [ -d "$app_dir" ]; then
              targets+=("$app_dir")
            elif [ -d "services/${svc}" ]; then
              targets+=("services/${svc}")
            fi
          done
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No Python services present — skipping bandit"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install --disable-pip-version-check --no-cache-dir \
            --only-binary :all: \
            --require-hashes \
            -r .github/requirements/bandit.txt
          set +e
          bandit -r "${targets[@]}" -x 'tests/,test_,.venv/' -f txt
          txt_rc=$?
          bandit -r "${targets[@]}" -x 'tests/,test_,.venv/' -f sarif -o bandit.sarif
          sarif_rc=$?
          set -e
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [ "$txt_rc" -ne 0 ] || [ "$sarif_rc" -ne 0 ]; then
            echo "Bandit failed (txt_rc=${txt_rc} sarif_rc=${sarif_rc})"
            exit 1
          fi
      - name: Bandit skipped summary
        if: steps.bandit.outputs.run != 'true'
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Bandit (Python) skipped

          No Python service directories are checked in yet (`services/memory/`, `services/embedder/`, `services/mcp-memory/`).

          - **Why**: Bandit is scoped to deployable Python services only.
          - **Effect**: `bandit.sarif` is not generated, so the “Upload Bandit SARIF” step is skipped as well.
          - **Enables automatically**: Once a Python service directory exists, Bandit will run and upload SARIF to Code Scanning.
          EOF
          printf "Bandit skipped: no Python services present\n" > bandit-skip.txt
      - name: Upload Bandit skip note
        if: steps.bandit.outputs.run != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-skip
          path: bandit-skip.txt
          retention-days: 7
      - name: Upload Bandit SARIF
        if: always() && steps.bandit.outputs.run == 'true'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: bandit.sarif
          category: bandit

  web-go-quality-gate:
    name: web-go-quality-gate
    needs:
      - changes
      - proto-contract
      - golangci-lint
      - security-integration
      - coverage
      - proxy-auth-smoke
      - go-race
      - go-services
      - auth-validate-smoke
      - proxy-agent-verify-smoke
      - govulncheck
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.run_web == 'true' &&
      needs.changes.outputs.run_go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Go quality gates passed for web deploy"

  web-deploy:
    name: web-deploy
    needs:
      - changes
      - repo-guards
      - web-build
      - web-go-quality-gate
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.run_web == 'true' &&
      needs.repo-guards.result == 'success' &&
      needs.web-build.result == 'success' &&
      (needs.changes.outputs.run_go != 'true' || needs.web-go-quality-gate.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/web-deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  govulncheck:
    name: govulncheck
    needs: [changes, proto-contract]
    if: needs.changes.outputs.run_go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs
        working-directory: packages/proto
        run: buf generate
      - name: Install govulncheck
        run: bash .github/scripts/install-go-ci-tool.sh golang.org/x/vuln/cmd/govulncheck
      - name: Run govulncheck
        run: |
          govulncheck ./packages/... ./services/auth/... ./services/proxy/...

  license-check:
    name: license-check
    needs: changes
    if: needs.changes.outputs.run_go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs
        working-directory: packages/proto
        run: buf generate
      - name: Install go-licenses
        env:
          TOOLS_MOD_DIR: ${{ github.workspace }}/.github/tools/licenses
        run: bash .github/scripts/install-go-ci-tool.sh github.com/google/go-licenses
      - name: Verify dependency licenses
        run: |
          go-licenses check ./packages/... ./services/auth/... ./services/proxy/... \
            --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,Unicode-DFS-2016,MPL-2.0

