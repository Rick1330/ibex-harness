  attest-provenance:
    name: attest-provenance
    needs: [push-auth, push-proxy, push-embedder, push-mcp-memory, push-memory]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Resolve repository path
        id: repo_meta
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest auth image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/auth
          subject-digest: ${{ needs.push-auth.outputs.digest }}
          push-to-registry: true

      - name: Attest proxy image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/proxy
          subject-digest: ${{ needs.push-proxy.outputs.digest }}
          push-to-registry: true

      - name: Attest embedder image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/embedder
          subject-digest: ${{ needs.push-embedder.outputs.digest }}
          push-to-registry: true

      - name: Attest mcp-memory image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/mcp-memory
          subject-digest: ${{ needs.push-mcp-memory.outputs.digest }}
          push-to-registry: true


      - name: Attest memory image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/memory
          subject-digest: ${{ needs.push-memory.outputs.digest }}
          push-to-registry: true


  notify:
    name: notify
    needs:
      - resolve-tag
      - scan-image-auth
      - scan-image-proxy
      - scan-image-embedder
      - scan-image-mcp-memory
      - scan-image-memory
      - push-auth
      - push-proxy
      - push-embedder
      - push-mcp-memory
      - push-memory
      - attest-provenance
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Post Docker Publish summary comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          AUTH_DIGEST: ${{ needs.push-auth.outputs.digest }}
          PROXY_DIGEST: ${{ needs.push-proxy.outputs.digest }}
          EMBEDDER_DIGEST: ${{ needs.push-embedder.outputs.digest }}
          MCP_MEMORY_DIGEST: ${{ needs.push-mcp-memory.outputs.digest }}
          MEMORY_DIGEST: ${{ needs.push-memory.outputs.digest }}
          REPO_LC: ${{ github.repository }}
          RESULT_SCAN_AUTH: ${{ needs.scan-image-auth.result }}
          RESULT_SCAN_PROXY: ${{ needs.scan-image-proxy.result }}
          RESULT_SCAN_EMBEDDER: ${{ needs.scan-image-embedder.result }}
          RESULT_SCAN_MCP_MEMORY: ${{ needs.scan-image-mcp-memory.result }}
          RESULT_SCAN_MEMORY: ${{ needs.scan-image-memory.result }}
          RESULT_PUSH_AUTH: ${{ needs.push-auth.result }}
          RESULT_PUSH_PROXY: ${{ needs.push-proxy.result }}
          RESULT_PUSH_EMBEDDER: ${{ needs.push-embedder.result }}
          RESULT_PUSH_MCP_MEMORY: ${{ needs.push-mcp-memory.result }}
          RESULT_PUSH_MEMORY: ${{ needs.push-memory.result }}
          RESULT_ATTEST: ${{ needs.attest-provenance.result }}
        run: |
          repo_lc="${REPO,,}"
          if [ -z "${TAG}" ]; then
            # resolve-tag job can be skipped when CI didn't succeed (workflow_run gate).
            TAG="(not-run)"
          fi

          auth_image="ghcr.io/${repo_lc}/auth:${TAG}"
          proxy_image="ghcr.io/${repo_lc}/proxy:${TAG}"
          embedder_image="ghcr.io/${repo_lc}/embedder:${TAG}"
          mcp_memory_image="ghcr.io/${repo_lc}/mcp-memory:${TAG}"
          memory_image="ghcr.io/${repo_lc}/memory:${TAG}"

          cat <<EOF > body.md
          ## Docker Publish

          - **Run**: ${RUN_URL}
          - **Commit**: \`${HEAD_SHA}\`
          - **Tag**: \`${TAG}\`

          ### Images
          - **Auth**: \`${auth_image}\`  \`${AUTH_DIGEST}\`
          - **Proxy**: \`${proxy_image}\`  \`${PROXY_DIGEST}\`
          - **Embedder**: \`${embedder_image}\`  \`${EMBEDDER_DIGEST}\`
          - **MCP Memory**: \`${mcp_memory_image}\`  \`${MCP_MEMORY_DIGEST}\`
          - **Memory**: \`${memory_image}\`  \`${MEMORY_DIGEST}\`

          ### Job results
          - scan-image-auth: **${RESULT_SCAN_AUTH}**
          - scan-image-proxy: **${RESULT_SCAN_PROXY}**
          - scan-image-embedder: **${RESULT_SCAN_EMBEDDER}**
          - scan-image-mcp-memory: **${RESULT_SCAN_MCP_MEMORY}**
          - scan-image-memory: **${RESULT_SCAN_MEMORY}**
          - push-auth: **${RESULT_PUSH_AUTH}**
          - push-proxy: **${RESULT_PUSH_PROXY}**
          - push-embedder: **${RESULT_PUSH_EMBEDDER}**
          - push-mcp-memory: **${RESULT_PUSH_MCP_MEMORY}**
          - push-memory: **${RESULT_PUSH_MEMORY}**
          - attest-provenance: **${RESULT_ATTEST}**

          EOF

          gh api "repos/${REPO}/commits/${HEAD_SHA}/comments" -f body="$(cat body.md)" >/dev/null
