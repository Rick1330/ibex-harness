          path: /tmp/relay.tar
          retention-days: 1

  scan-image-auth:
    name: scan-image-auth
    needs: build-auth
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Download auth OCI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-auth
          path: /tmp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-trivy
        with:
          version: v0.70.0
      - name: Scan auth image with Trivy
        run: |
          trivy image --input /tmp/auth.tar \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif \
            --output trivy-image-auth.sarif \
            --exit-code 1
      - name: Upload Trivy auth SARIF
        if: always() && hashFiles('trivy-image-auth.sarif') != ''
