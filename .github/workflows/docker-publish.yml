      - name: Resolve push tags
        id: tags
        env:
          IMAGE_TAG: ${{ needs.resolve-tag.outputs.tag }}
          PUSH_LATEST: ${{ needs.resolve-tag.outputs.push_latest }}
        run: |
          repo_lc="${GITHUB_REPOSITORY,,}"
          tags="ghcr.io/${repo_lc}/embedder:${IMAGE_TAG}"
          if [ "${PUSH_LATEST}" = "true" ]; then
            tags="${tags}"$'\n'"ghcr.io/${repo_lc}/embedder:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push embedder image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/embedder/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=embedder
          cache-to: type=gha,mode=max,scope=embedder

