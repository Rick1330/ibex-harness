name: Docker Publish

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/auth/**'
      - 'services/proxy/**'
      - 'services/embedder/**'
      - 'services/mcp-memory/**'
      - 'services/memory/**'
      - 'packages/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker-publish.yml'
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (e.g. latest or v1.0.0)
        required: true
        default: latest
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

# Jobs declare permissions explicitly (SonarQube S8264: no workflow-level read).
permissions: {}

jobs:
  detect-docker-changes:
    name: detect-docker-changes
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_docker: ${{ steps.detect.outputs.run_docker }}
      run_go: ${{ steps.detect.outputs.run_go }}
    steps:
      # workflow_run: default checkout uses the trusted triggering commit on main (no head_sha).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_run'
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_run'
        with:
          fetch-depth: '0'
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          fetch-depth: ${{ github.event_name == 'workflow_run' && '2' || '0' }}

  resolve-tag:
    name: resolve-tag
    needs: detect-docker-changes
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'workflow_call') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (needs.detect-docker-changes.outputs.run_docker == 'true' ||
        needs.detect-docker-changes.outputs.run_go == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      push_latest: ${{ steps.meta.outputs.push_latest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Resolve and validate image tag
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          case "${{ github.event_name }}" in
            workflow_call|workflow_dispatch)
              tag="${INPUT_IMAGE_TAG}"
              ;;
            pull_request)
              # PR runs are scan-only; publish jobs are gated out.
              tag="latest"
              ;;
            workflow_run)
              tag="latest"
              ;;
            *)
              echo "unsupported event: ${{ github.event_name }}"
              exit 1
              ;;
          esac

          case "${tag}" in
            latest|v[0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo "invalid image tag: ${tag}"
              exit 1
              ;;
          esac

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "${tag}" == "latest" ]] || [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build-auth:
    name: build-auth
    needs: resolve-tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs
        run: |
          cd packages/proto
          buf generate
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build auth image artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/auth/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/auth.tar
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth
      - name: Upload auth OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-auth
          path: /tmp/auth.tar
          retention-days: 1

  build-proxy:
    name: build-proxy
    needs: resolve-tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs
        run: |
          cd packages/proto
          buf generate
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build proxy image artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/proxy/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/proxy.tar
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy
      - name: Upload proxy OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-proxy
          path: /tmp/proxy.tar
          retention-days: 1

  build-embedder:
    name: build-embedder
    needs: resolve-tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build embedder image artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/embedder/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/embedder.tar
          cache-from: type=gha,scope=embedder
          cache-to: type=gha,mode=max,scope=embedder
      - name: Upload embedder OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-embedder
          path: /tmp/embedder.tar
          retention-days: 1

  build-mcp-memory:
    name: build-mcp-memory
    needs: resolve-tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build mcp-memory image artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/mcp-memory/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/mcp-memory.tar
          cache-from: type=gha,scope=mcp-memory
          cache-to: type=gha,mode=max,scope=mcp-memory
      - name: Upload mcp-memory OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-mcp-memory
          path: /tmp/mcp-memory.tar
          retention-days: 1


  build-memory:
    name: build-memory
    needs: resolve-tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build memory image artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/memory/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/memory.tar
          cache-from: type=gha,scope=memory
          cache-to: type=gha,mode=max,scope=memory
      - name: Upload memory OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-memory
          path: /tmp/memory.tar
          retention-days: 1

  scan-image-auth:
    name: scan-image-auth
    needs: build-auth
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download auth OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-auth
          path: /tmp
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.0
        with:
          version: v0.70.0
      - name: Scan auth image with Trivy
        run: |
          trivy image --input /tmp/auth.tar \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif \
            --output trivy-image-auth.sarif \
            --exit-code 1
      - name: Upload Trivy auth SARIF
        if: always() && hashFiles('trivy-image-auth.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-image-auth.sarif
          category: trivy-image-auth

  scan-image-proxy:
    name: scan-image-proxy
    needs: build-proxy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download proxy OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-proxy
          path: /tmp
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.0
        with:
          version: v0.70.0
      - name: Scan proxy image with Trivy
        run: |
          trivy image --input /tmp/proxy.tar \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif \
            --output trivy-image-proxy.sarif \
            --exit-code 1
      - name: Upload Trivy proxy SARIF
        if: always() && hashFiles('trivy-image-proxy.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-image-proxy.sarif
          category: trivy-image-proxy

  scan-image-embedder:
    name: scan-image-embedder
    needs: build-embedder
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download embedder OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-embedder
          path: /tmp
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.0
        with:
          version: v0.70.0
      - name: Scan embedder image with Trivy
        run: |
          # Table first so failing CVEs are visible in job logs (SARIF alone is opaque).
          set +e
          trivy image --input /tmp/embedder.tar \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format table \
            --exit-code 1
          table_rc=$?
          trivy image --input /tmp/embedder.tar \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif \
            --output trivy-image-embedder.sarif \
            --exit-code 0
          sarif_rc=$?
          set -e
          if [ "$table_rc" -ne 0 ] || [ "$sarif_rc" -ne 0 ]; then
            exit 1
          fi
      - name: Upload Trivy embedder SARIF
        if: always() && hashFiles('trivy-image-embedder.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-image-embedder.sarif
          category: trivy-image-embedder

  scan-image-mcp-memory:
    name: scan-image-mcp-memory
    needs: build-mcp-memory
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download mcp-memory OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-mcp-memory
          path: /tmp
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.0
        with:
          version: v0.70.0
      - name: Scan mcp-memory image with Trivy
        run: |
          set +e
          trivy image --input /tmp/mcp-memory.tar \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format table \
            --exit-code 1
          table_rc=$?
          trivy image --input /tmp/mcp-memory.tar \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif \
            --output trivy-image-mcp-memory.sarif \
            --exit-code 0
          sarif_rc=$?
          set -e
          if [ "$table_rc" -ne 0 ] || [ "$sarif_rc" -ne 0 ]; then
            exit 1
          fi
      - name: Upload Trivy mcp-memory SARIF
        if: always() && hashFiles('trivy-image-mcp-memory.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-image-mcp-memory.sarif
          category: trivy-image-mcp-memory


  scan-image-memory:
    name: scan-image-memory
    needs: build-memory
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download memory OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-memory
          path: /tmp
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.0
        with:
          version: v0.70.0
      - name: Scan memory image with Trivy
        run: |
          set +e
          trivy image --input /tmp/memory.tar \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format table \
            --exit-code 1
          table_rc=$?
          trivy image --input /tmp/memory.tar \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif \
            --output trivy-image-memory.sarif \
            --exit-code 0
          sarif_rc=$?
          set -e
          if [ "$table_rc" -ne 0 ] || [ "$sarif_rc" -ne 0 ]; then
            exit 1
          fi
      - name: Upload Trivy memory SARIF
        if: always() && hashFiles('trivy-image-memory.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-image-memory.sarif
          category: trivy-image-memory

  push-auth:
    name: push-auth
    needs: [resolve-tag, scan-image-auth]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs
        run: |
          cd packages/proto
          buf generate
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve push tags
        id: tags
        env:
          IMAGE_TAG: ${{ needs.resolve-tag.outputs.tag }}
          PUSH_LATEST: ${{ needs.resolve-tag.outputs.push_latest }}
        run: |
          repo_lc="${GITHUB_REPOSITORY,,}"
          tags="ghcr.io/${repo_lc}/auth:${IMAGE_TAG}"
          if [ "${PUSH_LATEST}" = "true" ]; then
            tags="${tags}"$'\n'"ghcr.io/${repo_lc}/auth:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push auth image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/auth/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth

  push-proxy:
    name: push-proxy
    needs: [resolve-tag, scan-image-proxy]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs
        run: |
          cd packages/proto
          buf generate
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve push tags
        id: tags
        env:
          IMAGE_TAG: ${{ needs.resolve-tag.outputs.tag }}
          PUSH_LATEST: ${{ needs.resolve-tag.outputs.push_latest }}
        run: |
          repo_lc="${GITHUB_REPOSITORY,,}"
          tags="ghcr.io/${repo_lc}/proxy:${IMAGE_TAG}"
          if [ "${PUSH_LATEST}" = "true" ]; then
            tags="${tags}"$'\n'"ghcr.io/${repo_lc}/proxy:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push proxy image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

