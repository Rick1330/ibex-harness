name: Docker Publish

# Published images: one push-* job each. The set must equal every --services
# list in release-docker.yml; infra/scripts/test-ci-tiering.sh enforces that, so
# changing one without the other fails CI.
#
#   auth, proxy, embedder, mcp-memory, memory, api, worker, context, console, relay
#
# The set is "what the supported v1 profile runs" (ADR-0097,
# infra/compose/v1-single-node/compose.yml) plus the services that have another
# shipped deployment path:
#
#   - mcp-memory is published for the Helm chart's mcp-memory deployment, which
#     the Compose profile does not run (templates/mcp-memory-deployment.yaml).
#     Its continued publication is a keep-or-retire decision, not a follower of
#     the profile: while that template ships, the image must exist.
#   - relay is the default-off evidence daemon (ADR-0085, GAP-011). Publishing
#     it makes the "deployable daemon" claim testable; no profile enables it yet.
#   - console (services/console) runs in the supported profile, so it publishes.
#     It clears the scan gate this workflow enforces only because stage 2 of its
#     Dockerfile deletes the package managers the node base image ships: all ten
#     HIGH findings the image used to report (5x brace-expansion CVE-2026-102276,
#     -102278, -13149, -14257, -69152; ip-address CVE-2026-69192; pacote
#     CVE-2026-9496; picomatch CVE-2026-33671; sigstore CVE-2026-48815) were
#     packages bundled under /usr/local/lib/node_modules/npm/node_modules/, and
#     the SSR bundle under app/.output/server/node_modules/ reports none. The
#     runtime CMD is `node .output/server/index.mjs`; npm, npx and corepack are
#     never called after the build stage, which keeps them. Do not re-add a
#     package manager to the runtime stage without re-scanning: that is the one
#     change that puts the ten findings back.
#
# Not published, recorded as gaps rather than forced:
#
#   - mcp-operator has a Dockerfile, no deployment path, and no consumer in the
#     supported profile. An image nothing runs is unowned supply chain.
#   - migrate (infra/migrations/Dockerfile) builds from the same context and its
#     SQL is go:embed'ed, but the release manifest and the verifier address an
#     image as services/<name>/Dockerfile (infra/scripts/release-manifest.py
#     _validate_services). Publishing it needs a manifest-generator change, so
#     it stays a recorded gap instead of a release that cannot generate.
#   - The Helm chart already carries values.images.migrate with
#     migrate.enabled=false for the same reason.

env:
  # Primary GHCR DB + mirror fallback (comma-separated per Trivy docs).
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/**/Dockerfile'
      - 'services/**/app/**'
      - 'services/**/scripts/**'
      - 'services/auth/**'
      - 'services/proxy/**'
      - 'services/context/**'
      - 'services/console/**'
      - 'services/relay/**'
      - 'infra/provider-capabilities/**'
      - 'services/**/pyproject.toml'
      - 'services/**/uv.lock'
      - 'services/**/requirements*.txt'
      - 'packages/**'
      - 'go.mod'
      - 'go.sum'
      # Root workspace config copied into the console image build
      # (services/console/Dockerfile: `COPY package.json pnpm-lock.yaml
      # pnpm-workspace.yaml .npmrc ./`). Before this, an .npmrc-only change
      # matched no entry here: no PR scan, and after merge the change detector
      # left run_docker false, so the publish skipped and :latest kept the old
      # install layout while the merged source used the new one. These four
      # entries are that COPY line's input contract, and
      # infra/scripts/test-ci-tiering.sh fails if the line grows a file this list
      # does not name — including a source that lands on a continuation line.
      - '.npmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docker-publish.yml'
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets: {}
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (e.g. latest or v1.0.0)
        required: true
        default: latest
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

# Jobs declare permissions explicitly (SonarQube S8264: no workflow-level read).
permissions: {}

jobs:
  detect-docker-changes:
    name: detect-docker-changes
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_docker: ${{ steps.detect.outputs.run_docker }}
      run_go: ${{ steps.detect.outputs.run_go }}
    steps:
      # workflow_run: default checkout uses the trusted triggering commit on main (no head_sha).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_run'
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_run'
        with:
          fetch-depth: '0'
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          fetch-depth: ${{ github.event_name == 'workflow_run' && '2' || '0' }}

  resolve-tag:
    name: resolve-tag
    needs: detect-docker-changes
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'workflow_call') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (needs.detect-docker-changes.outputs.run_docker == 'true' ||
        needs.detect-docker-changes.outputs.run_go == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      push_latest: ${{ steps.meta.outputs.push_latest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Resolve and validate image tag
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          case "${{ github.event_name }}" in
            workflow_call|workflow_dispatch)
              tag="${INPUT_IMAGE_TAG}"
              ;;
            push)
              # release-docker.yml calls this workflow on a tag push. GitHub keeps
              # the caller's event (push), so inputs.image_tag carries the release
              # tag; fall back to the ref name if a caller omits it.
              tag="${INPUT_IMAGE_TAG:-${GITHUB_REF_NAME}}"
              ;;
            pull_request)
              # PR runs are scan-only; publish jobs are gated out.
              tag="latest"
              ;;
            workflow_run)
              tag="latest"
              ;;
            *)
              echo "unsupported event: ${{ github.event_name }}"
              exit 1
              ;;
          esac

          case "${tag}" in
            latest|v[0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo "invalid image tag: ${tag}"
              exit 1
              ;;
          esac

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "${tag}" == "latest" ]] || [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build-auth:
    name: build-auth
    needs: resolve-tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs
        run: |
          cd packages/proto
          buf generate
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build auth image artifact
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/auth/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/auth.tar
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth
      - name: Upload auth OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-auth
          path: /tmp/auth.tar
          retention-days: 1

  build-proxy:
    name: build-proxy
    needs: resolve-tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs
        run: |
          cd packages/proto
          buf generate
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build proxy image artifact
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/proxy/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/proxy.tar
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy
      - name: Upload proxy OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-proxy
          path: /tmp/proxy.tar
          retention-days: 1

  build-embedder:
    name: build-embedder
    needs: resolve-tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build embedder image artifact
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/embedder/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/embedder.tar
          cache-from: type=gha,scope=embedder
          cache-to: type=gha,mode=max,scope=embedder
      - name: Upload embedder OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-embedder
          path: /tmp/embedder.tar
          retention-days: 1

  build-mcp-memory:
    name: build-mcp-memory
    needs: resolve-tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build mcp-memory image artifact
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/mcp-memory/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/mcp-memory.tar
          cache-from: type=gha,scope=mcp-memory
          cache-to: type=gha,mode=max,scope=mcp-memory
      - name: Upload mcp-memory OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-mcp-memory
          path: /tmp/mcp-memory.tar
          retention-days: 1


  build-memory:
    name: build-memory
    needs: resolve-tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build memory image artifact
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
