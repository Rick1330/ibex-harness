  # Multi-arch honesty: amd64 tar is the PR gate; after push, scan the exact
  # index digest that was published (covers arm64 layers too).
  scan-pushed-worker:
    name: scan-pushed-worker
    needs: [push-worker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      packages: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-trivy
        with:
          version: v0.70.0
      - name: Scan pushed worker image by digest
        env:
          WORKER_DIGEST: ${{ needs.push-worker.outputs.digest }}
        run: |
          set -euo pipefail
          repo_lc="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo_lc}/worker@${WORKER_DIGEST}"
          set +e
          trivy image "${image}" \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format table \
            --exit-code 1
          table_rc=$?
          trivy image "${image}" \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif \
            --output trivy-image-worker-pushed.sarif \
            --exit-code 0
          sarif_rc=$?
          set -e
          if [ "$table_rc" -ne 0 ] || [ "$sarif_rc" -ne 0 ]; then
            exit 1
          fi
      - name: Upload Trivy pushed-worker SARIF
        if: always() && hashFiles('trivy-image-worker-pushed.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image-worker-pushed.sarif
          category: trivy-image-worker-pushed

  # One SPDX SBOM per published image (P1-09). A single job, not one per image:
  # every push job already exposes the index digest it published, so one loop can
  # bind each document to that digest. Syft is the generator release.yml already
  # trusts (anchore/sbom-action). Scanning by index digest records that digest
  # verbatim as the document root package version, which is what makes the asset
  # attachable to an image instead of merely adjacent to it. Runs with
  # always() so a failed publish reports "no digest" instead of skipping the
  # SBOM silently; the guard below turns that into a named failure.
  sbom-images:
    name: sbom-images
    needs:
      - resolve-tag
      - push-auth
      - push-proxy
      - push-embedder
      - push-mcp-memory
      - push-memory
      - push-api
      - push-worker
      - push-context
      - push-console
      - push-relay
    if: always() && github.event_name != 'pull_request' && needs.resolve-tag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Generate one SBOM per published image
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          AUTH_DIGEST: ${{ needs.push-auth.outputs.digest }}
          PROXY_DIGEST: ${{ needs.push-proxy.outputs.digest }}
          EMBEDDER_DIGEST: ${{ needs.push-embedder.outputs.digest }}
          MCP_MEMORY_DIGEST: ${{ needs.push-mcp-memory.outputs.digest }}
          MEMORY_DIGEST: ${{ needs.push-memory.outputs.digest }}
          API_DIGEST: ${{ needs.push-api.outputs.digest }}
          WORKER_DIGEST: ${{ needs.push-worker.outputs.digest }}
          CONTEXT_DIGEST: ${{ needs.push-context.outputs.digest }}
          CONSOLE_DIGEST: ${{ needs.push-console.outputs.digest }}
          RELAY_DIGEST: ${{ needs.push-relay.outputs.digest }}
        run: |
          set -euo pipefail
          repo_lc="${GITHUB_REPOSITORY,,}"
          mkdir -p sboms
          while read -r service digest; do
            [ -n "$service" ] || continue
            if [ -z "$digest" ]; then
              echo "::error::no published digest for ${service}; refusing to emit an unbound SBOM"
              exit 1
            fi
            "$SYFT_CMD" "registry:ghcr.io/${repo_lc}/${service}@${digest}" \
              --output spdx-json \
              --file "sboms/${service}.sbom.spdx.json"
            jq -e --arg d "${digest}" \
              '[.packages[] | select(.SPDXID | startswith("SPDXRef-DocumentRoot"))]
               | length == 1 and .[0].versionInfo == $d' \
              "sboms/${service}.sbom.spdx.json" >/dev/null
          done <<EOF
          auth ${AUTH_DIGEST}
          proxy ${PROXY_DIGEST}
          embedder ${EMBEDDER_DIGEST}
          mcp-memory ${MCP_MEMORY_DIGEST}
          memory ${MEMORY_DIGEST}
          api ${API_DIGEST}
          worker ${WORKER_DIGEST}
          context ${CONTEXT_DIGEST}
          console ${CONSOLE_DIGEST}
          relay ${RELAY_DIGEST}
          EOF
      - name: Upload per-image SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sboms
          path: sboms/*.sbom.spdx.json
          # Longer than the OCI tars: these become release assets and an
          # operator may need the evidence for a release that failed later.
          retention-days: 5

  attest-provenance:
    name: attest-provenance
    needs: [push-auth, push-proxy, push-embedder, push-mcp-memory, push-memory, push-api, push-worker,
            push-context, push-console, push-relay, scan-pushed-worker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Resolve repository path
        id: repo_meta
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest auth image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/auth
          subject-digest: ${{ needs.push-auth.outputs.digest }}
          push-to-registry: true

      - name: Attest proxy image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/proxy
          subject-digest: ${{ needs.push-proxy.outputs.digest }}
          push-to-registry: true

      - name: Attest embedder image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/embedder
          subject-digest: ${{ needs.push-embedder.outputs.digest }}
          push-to-registry: true

      - name: Attest mcp-memory image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/mcp-memory
          subject-digest: ${{ needs.push-mcp-memory.outputs.digest }}
          push-to-registry: true


      - name: Attest memory image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/memory
          subject-digest: ${{ needs.push-memory.outputs.digest }}
          push-to-registry: true

      - name: Attest api image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/api
          subject-digest: ${{ needs.push-api.outputs.digest }}
          push-to-registry: true

      - name: Attest worker image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/worker
          subject-digest: ${{ needs.push-worker.outputs.digest }}
          push-to-registry: true

      - name: Attest context image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/context
          subject-digest: ${{ needs.push-context.outputs.digest }}
          push-to-registry: true

      - name: Attest console image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/console
          subject-digest: ${{ needs.push-console.outputs.digest }}
          push-to-registry: true

      - name: Attest relay image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/relay
          subject-digest: ${{ needs.push-relay.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # 4.P.5: extend keyless Cosign from SBOM blobs (release.yml) to image digests
      # so Kyverno verifyImages can admit signed GHCR images.
      - name: Cosign sign image digests (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          REPO="ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}"
          cosign sign --yes "${REPO}/auth@${{ needs.push-auth.outputs.digest }}"
          cosign sign --yes "${REPO}/proxy@${{ needs.push-proxy.outputs.digest }}"
          cosign sign --yes "${REPO}/embedder@${{ needs.push-embedder.outputs.digest }}"
          cosign sign --yes "${REPO}/mcp-memory@${{ needs.push-mcp-memory.outputs.digest }}"
          cosign sign --yes "${REPO}/memory@${{ needs.push-memory.outputs.digest }}"
          cosign sign --yes "${REPO}/api@${{ needs.push-api.outputs.digest }}"
          cosign sign --yes "${REPO}/worker@${{ needs.push-worker.outputs.digest }}"
          cosign sign --yes "${REPO}/context@${{ needs.push-context.outputs.digest }}"
          cosign sign --yes "${REPO}/console@${{ needs.push-console.outputs.digest }}"
          cosign sign --yes "${REPO}/relay@${{ needs.push-relay.outputs.digest }}"


  # notify is `if: always()` because it must report a run that published nothing,
  # which makes a green notify meaningless as evidence. This job is the terminal
  # status for every path that is expected to publish: it fails when a publish job
  # did not succeed, including the case where every publish job was skipped.
  publish-gate:
    name: publish-gate
    needs:
      - resolve-tag
      - push-auth
      - push-proxy
      - push-embedder
      - push-mcp-memory
      - push-memory
      - push-api
      - push-worker
      - push-context
      - push-console
      - push-relay
    # pull_request runs are scan-only. workflow_run runs where resolve-tag was
    # skipped publish nothing by design, so they stay outside this gate.
    if: always() && github.event_name != 'pull_request' && needs.resolve-tag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Require every image to be pushed
        env:
          PUSH_AUTH: ${{ needs.push-auth.result }}
          PUSH_PROXY: ${{ needs.push-proxy.result }}
          PUSH_EMBEDDER: ${{ needs.push-embedder.result }}
          PUSH_MCP_MEMORY: ${{ needs.push-mcp-memory.result }}
          PUSH_MEMORY: ${{ needs.push-memory.result }}
          PUSH_API: ${{ needs.push-api.result }}
          PUSH_WORKER: ${{ needs.push-worker.result }}
          PUSH_CONTEXT: ${{ needs.push-context.result }}
          PUSH_CONSOLE: ${{ needs.push-console.result }}
          PUSH_RELAY: ${{ needs.push-relay.result }}
        run: |
          set -euo pipefail
          failed=()
          for pair in \
            "auth=${PUSH_AUTH}" \
            "proxy=${PUSH_PROXY}" \
            "embedder=${PUSH_EMBEDDER}" \
            "mcp-memory=${PUSH_MCP_MEMORY}" \
            "memory=${PUSH_MEMORY}" \
            "api=${PUSH_API}" \
            "worker=${PUSH_WORKER}" \
            "context=${PUSH_CONTEXT}" \
            "console=${PUSH_CONSOLE}" \
            "relay=${PUSH_RELAY}"; do
            if [ "${pair#*=}" != "success" ]; then
              failed+=("${pair%%=*}=${pair#*=}")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::docker-publish did not publish: ${failed[*]}"
            exit 1
          fi
          echo "every publish job succeeded"

  notify:
    name: notify
    needs:
      - resolve-tag
      - scan-image-auth
      - scan-image-proxy
      - scan-image-embedder
      - scan-image-mcp-memory
      - scan-image-memory
      - scan-image-api
      - scan-image-worker
      - push-auth
      - push-proxy
      - push-embedder
      - push-mcp-memory
      - push-memory
      - push-api
      - push-worker
      - push-context
      - push-console
      - push-relay
      - scan-image-context
      - scan-image-console
      - scan-image-relay
      - scan-pushed-worker
      - sbom-images
      - attest-provenance
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Post Docker Publish summary comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          AUTH_DIGEST: ${{ needs.push-auth.outputs.digest }}
          PROXY_DIGEST: ${{ needs.push-proxy.outputs.digest }}
          EMBEDDER_DIGEST: ${{ needs.push-embedder.outputs.digest }}
          MCP_MEMORY_DIGEST: ${{ needs.push-mcp-memory.outputs.digest }}
          MEMORY_DIGEST: ${{ needs.push-memory.outputs.digest }}
          API_DIGEST: ${{ needs.push-api.outputs.digest }}
          CONTEXT_DIGEST: ${{ needs.push-context.outputs.digest }}
          CONSOLE_DIGEST: ${{ needs.push-console.outputs.digest }}
          RELAY_DIGEST: ${{ needs.push-relay.outputs.digest }}
          REPO_LC: ${{ github.repository }}
          RESULT_SCAN_AUTH: ${{ needs.scan-image-auth.result }}
          RESULT_SCAN_PROXY: ${{ needs.scan-image-proxy.result }}
          RESULT_SCAN_EMBEDDER: ${{ needs.scan-image-embedder.result }}
          RESULT_SCAN_MCP_MEMORY: ${{ needs.scan-image-mcp-memory.result }}
          RESULT_SCAN_MEMORY: ${{ needs.scan-image-memory.result }}
          RESULT_SCAN_API: ${{ needs.scan-image-api.result }}
          RESULT_SCAN_WORKER: ${{ needs.scan-image-worker.result }}
          RESULT_SCAN_CONTEXT: ${{ needs.scan-image-context.result }}
          RESULT_SCAN_CONSOLE: ${{ needs.scan-image-console.result }}
          RESULT_SCAN_RELAY: ${{ needs.scan-image-relay.result }}
          RESULT_PUSH_AUTH: ${{ needs.push-auth.result }}
          RESULT_PUSH_PROXY: ${{ needs.push-proxy.result }}
          RESULT_PUSH_EMBEDDER: ${{ needs.push-embedder.result }}
          RESULT_PUSH_MCP_MEMORY: ${{ needs.push-mcp-memory.result }}
          RESULT_PUSH_MEMORY: ${{ needs.push-memory.result }}
          RESULT_PUSH_API: ${{ needs.push-api.result }}
          RESULT_PUSH_WORKER: ${{ needs.push-worker.result }}
          RESULT_PUSH_CONTEXT: ${{ needs.push-context.result }}
          RESULT_PUSH_CONSOLE: ${{ needs.push-console.result }}
          RESULT_PUSH_RELAY: ${{ needs.push-relay.result }}
          RESULT_SCAN_PUSHED_WORKER: ${{ needs.scan-pushed-worker.result }}
          WORKER_DIGEST: ${{ needs.push-worker.outputs.digest }}
          RESULT_SBOM: ${{ needs.sbom-images.result }}
          RESULT_ATTEST: ${{ needs.attest-provenance.result }}
        run: |
          repo_lc="${REPO,,}"
          if [ -z "${TAG}" ]; then
            # resolve-tag job can be skipped when CI didn't succeed (workflow_run gate).
            TAG="(not-run)"
          fi

          auth_image="ghcr.io/${repo_lc}/auth:${TAG}"
          proxy_image="ghcr.io/${repo_lc}/proxy:${TAG}"
          embedder_image="ghcr.io/${repo_lc}/embedder:${TAG}"
          mcp_memory_image="ghcr.io/${repo_lc}/mcp-memory:${TAG}"
          memory_image="ghcr.io/${repo_lc}/memory:${TAG}"
          api_image="ghcr.io/${repo_lc}/api:${TAG}"
          worker_image="ghcr.io/${repo_lc}/worker:${TAG}"
          context_image="ghcr.io/${repo_lc}/context:${TAG}"
          console_image="ghcr.io/${repo_lc}/console:${TAG}"
          relay_image="ghcr.io/${repo_lc}/relay:${TAG}"

          cat <<EOF > body.md
          ## Docker Publish

          - **Run**: ${RUN_URL}
          - **Commit**: \`${HEAD_SHA}\`
          - **Tag**: \`${TAG}\`

          ### Images
          - **Auth**: \`${auth_image}\`  \`${AUTH_DIGEST}\`
          - **Proxy**: \`${proxy_image}\`  \`${PROXY_DIGEST}\`
          - **Embedder**: \`${embedder_image}\`  \`${EMBEDDER_DIGEST}\`
          - **MCP Memory**: \`${mcp_memory_image}\`  \`${MCP_MEMORY_DIGEST}\`
          - **Memory**: \`${memory_image}\`  \`${MEMORY_DIGEST}\`
          - **API**: \`${api_image}\`  \`${API_DIGEST}\`
          - **Worker**: \`${worker_image}\`  \`${WORKER_DIGEST}\`
          - **Context**: \`${context_image}\`  \`${CONTEXT_DIGEST}\`
          - **Console**: \`${console_image}\`  \`${CONSOLE_DIGEST}\`
          - **Relay**: \`${relay_image}\`  \`${RELAY_DIGEST}\`

          ### Job results
          - scan-image-auth: **${RESULT_SCAN_AUTH}**
          - scan-image-proxy: **${RESULT_SCAN_PROXY}**
          - scan-image-embedder: **${RESULT_SCAN_EMBEDDER}**
          - scan-image-mcp-memory: **${RESULT_SCAN_MCP_MEMORY}**
          - scan-image-memory: **${RESULT_SCAN_MEMORY}**
          - scan-image-api: **${RESULT_SCAN_API}**
          - scan-image-worker: **${RESULT_SCAN_WORKER}**
          - scan-image-context: **${RESULT_SCAN_CONTEXT}**
          - scan-image-console: **${RESULT_SCAN_CONSOLE}**
          - scan-image-relay: **${RESULT_SCAN_RELAY}**
          - push-auth: **${RESULT_PUSH_AUTH}**
          - push-proxy: **${RESULT_PUSH_PROXY}**
          - push-embedder: **${RESULT_PUSH_EMBEDDER}**
          - push-mcp-memory: **${RESULT_PUSH_MCP_MEMORY}**
          - push-memory: **${RESULT_PUSH_MEMORY}**
          - push-api: **${RESULT_PUSH_API}**
          - push-worker: **${RESULT_PUSH_WORKER}**
          - push-context: **${RESULT_PUSH_CONTEXT}**
          - push-console: **${RESULT_PUSH_CONSOLE}**
          - push-relay: **${RESULT_PUSH_RELAY}**
          - sbom-images: **${RESULT_SBOM}**
          - scan-pushed-worker: **${RESULT_SCAN_PUSHED_WORKER}**
          - attest-provenance: **${RESULT_ATTEST}**

          EOF

          gh api "repos/${REPO}/commits/${HEAD_SHA}/comments" -f body="$(cat body.md)" >/dev/null
