  push-auth:
    name: push-auth
    needs: [resolve-tag, scan-image-auth]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buf
      - name: Generate protobuf stubs
        run: |
          cd packages/proto
          buf generate
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve push tags
        id: tags
        env:
          IMAGE_TAG: ${{ needs.resolve-tag.outputs.tag }}
          PUSH_LATEST: ${{ needs.resolve-tag.outputs.push_latest }}
        run: |
          repo_lc="${GITHUB_REPOSITORY,,}"
          tags="ghcr.io/${repo_lc}/auth:${IMAGE_TAG}"
          if [ "${PUSH_LATEST}" = "true" ]; then
            tags="${tags}"$'\n'"ghcr.io/${repo_lc}/auth:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push auth image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/auth/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth

