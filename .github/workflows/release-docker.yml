name: Tagged Release Docker

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: tagged-release-docker-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: validate-tag
    # Fail before publishing images when the tag is not vX.Y.Z. The workflow
    # glob also matches v1.2.3-rc1 and v1.2.3+meta, which the manifest rejects.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unsupported release tag: $TAG"
            exit 1
          fi

  tagged-docker-publish:
    name: tagged-docker-publish
    needs: validate-tag
    # Callee jobs need packages/id-token/attestations; caller must grant them (cannot elevate).
    # contents:write is required by docker-publish `notify` (commit comment); contents:read
    # alone causes reusable-workflow startup_failure on tag push.
    permissions:
      packages: write
      id-token: write
      attestations: write
      security-events: write
      contents: write
    secrets: inherit
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_tag: ${{ github.ref_name }}

  verify-published-images:
    name: verify-published-images
    needs: [validate-tag, tagged-docker-publish]
    # The called workflow can finish green while every publish job is skipped, so
    # its status is not evidence that an image exists. Assert the published
    # artifact at the tag; a skipped job cannot satisfy this.
    if: always() && needs.validate-tag.result == 'success'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify every release image resolves at the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash infra/scripts/verify-release-images.sh \
            --tag "$TAG" \
            --services auth,proxy,api,memory,embedder,worker,mcp-memory,context,relay

  release-manifest:
    name: release-manifest
    # Runs only after the versioned images are pushed and verified, so digests
    # are immutable and a skipped publish cannot produce a manifest.
    needs: [tagged-docker-publish, verify-published-images]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Installs the hash-locked jsonschema already used by the generator tests.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate release manifest
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Published set only: mcp-operator has a Dockerfile and no publish job,
          # and migrate (infra/migrations/Dockerfile) is not addressable as
          # services/<name>/Dockerfile, which is what this generator validates.
          python3 infra/scripts/release-manifest.py \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --repository "$REPOSITORY" \
            --services auth,proxy,api,memory,embedder,worker,mcp-memory,context,relay \
            --output release-manifest.json
      - name: Validate the release manifest against the schema
        run: |
          # Fail before a release is created or an asset is uploaded, so a
          # non-conforming manifest never reaches consumers.
          uv run --no-project --no-build \
            --with-requirements infra/scripts/release-manifest-test-requirements.txt \
            python3 infra/scripts/validate-release-manifest.py release-manifest.json
      - name: Download the per-image SBOMs from this release run
        # docker-publish runs as a called workflow inside this run, so its
        # image-sboms artifact is addressable here. No artifact means the SBOM
        # job did not succeed, which is a release blocker, not a warning.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sboms
          path: sboms
      - name: Bind every SBOM to the digest the manifest publishes
        # The manifest is the digest authority for this release. An SBOM that
        # does not name its own image digest is a file next to the release, not
        # an attachment to the image, so a mismatch fails the release rather
        # than shipping an unverifiable asset.
        run: |
          set -euo pipefail
          rc=0
          while read -r service; do
            sbom="sboms/${service}.sbom.spdx.json"
            digest="$(jq -r --arg s "$service" '.images[$s]' release-manifest.json)"
            if [[ ! -f "$sbom" ]]; then
              echo "::error::missing SBOM for ${service} (${digest})"
              rc=1
              continue
            fi
            if ! jq -e --arg d "$digest" \
              '[.packages[] | select(.SPDXID | startswith("SPDXRef-DocumentRoot"))]
               | length == 1 and .[0].versionInfo == $d' \
              "$sbom" >/dev/null; then
              echo "::error::${sbom} does not describe ${service}@${digest}"
              rc=1
              continue
            fi
            echo "ok      ${sbom} ${digest}"
          done < <(jq -r '.images | keys[]' release-manifest.json)
          if [[ "$rc" -ne 0 ]]; then
            exit 1
          fi
      - name: Ensure the GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.VERSION_RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Release $TAG"
          fi
      - name: Upload release manifest and per-image SBOMs
        env:
          GH_TOKEN: ${{ secrets.VERSION_RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # One asset per published image, named <service>.sbom.spdx.json and
          # bound to the digest in release-manifest.json by the step above.
          gh release upload "$TAG" release-manifest.json sboms/*.sbom.spdx.json --clobber
