name: Tagged Release Docker

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: tagged-release-docker-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: validate-tag
    # Fail before publishing images when the tag is not vX.Y.Z. The workflow
    # glob also matches v1.2.3-rc1 and v1.2.3+meta, which the manifest rejects.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unsupported release tag: $TAG"
            exit 1
          fi

  tagged-docker-publish:
    name: tagged-docker-publish
    needs: validate-tag
    # Callee jobs need packages/id-token/attestations; caller must grant them (cannot elevate).
    # contents:write is required by docker-publish `notify` (commit comment); contents:read
    # alone causes reusable-workflow startup_failure on tag push.
    permissions:
      packages: write
      id-token: write
      attestations: write
      security-events: write
      contents: write
    secrets: inherit
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_tag: ${{ github.ref_name }}

  release-manifest:
    name: release-manifest
    # Runs only after the versioned images are pushed, so digests are immutable.
    needs: tagged-docker-publish
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate release manifest
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # mcp-operator has a Dockerfile but is not published by docker-publish yet.
          python3 infra/scripts/release-manifest.py \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --repository "$REPOSITORY" \
            --services auth,proxy,api,memory,embedder,worker,mcp-memory \
            --output release-manifest.json
      - name: Ensure the GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.VERSION_RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Release $TAG"
          fi
      - name: Upload release manifest
        env:
          GH_TOKEN: ${{ secrets.VERSION_RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release-manifest.json --clobber
