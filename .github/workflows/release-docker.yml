name: Tagged Release Docker

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: tagged-release-docker-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: validate-tag
    # Fail before publishing images when the tag is not vX.Y.Z. The workflow
    # glob also matches v1.2.3-rc1 and v1.2.3+meta, which the manifest rejects.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unsupported release tag: $TAG"
            exit 1
          fi

  tagged-docker-publish:
    name: tagged-docker-publish
    needs: validate-tag
    # Callee jobs need packages/id-token/attestations; caller must grant them (cannot elevate).
    # contents:write is required by docker-publish `notify` (commit comment); contents:read
    # alone causes reusable-workflow startup_failure on tag push.
    permissions:
      packages: write
      id-token: write
      attestations: write
      security-events: write
      contents: write
    secrets: inherit
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_tag: ${{ github.ref_name }}

  verify-published-images:
    name: verify-published-images
    needs: [validate-tag, tagged-docker-publish]
    # The called workflow can finish green while every publish job is skipped, so
    # its status is not evidence that an image exists. Assert the published
    # artifact at the tag; a skipped job cannot satisfy this.
    if: always() && needs.validate-tag.result == 'success'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify every release image resolves at the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash infra/scripts/verify-release-images.sh \
            --tag "$TAG" \
            --services auth,proxy,api,memory,embedder,worker,mcp-memory,context,console,relay

  release-manifest:
    name: release-manifest
    # Runs only after the versioned images are pushed and verified, so digests
    # are immutable and a skipped publish cannot produce a manifest.
    needs: [tagged-docker-publish, verify-published-images]
    permissions:
      contents: read
      packages: read
      # Resolve the CI push run for this commit and download its smoke artifact.
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Installs the hash-locked jsonschema already used by the generator tests.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # P1-11: the bundle smoke runs in ci.yml on the pushed commit and uploads
      # bundle-smoke-result.json. Artifacts belong to a run, so a tag push cannot reach
      # them through `needs:`; the run for this exact commit is resolved through the
      # API instead. release-manifest.py is unchanged and still refuses to promote a
      # bundle whose smoke `commit` differs from this release's commit or whose
      # `finished_at` is not a timezone-aware timestamp, so an artifact from another
      # commit can never promote a bundle here.
      #
      # The lookup is bounded polling, not a single call. `gh run list` reports a run
      # only once it is registered, and ci.yml and this workflow both start from the
      # release merge with no dependency edge between them, so one release finishing
      # while CI was still running recorded `unverified` for an artifact uploaded
      # minutes earlier, and nothing retried.
      #
      # The bound is measured, not rounded. The v0.1.10 release commit's CI run
      # (44086160092) completed at 12:58:43 while release-manifest started at 12:52:22,
      # so the release needed 381 s of waiting; the previous bound of 360 s (24 x 15 s)
      # would have expired 21 s short and recorded `unverified` for evidence that
      # existed. CI on main since 2026-11-01 (55 runs) runs p50 842 s, p95 1166 s,
      # max 1209 s, and this job starts ~380 s after the tag, so a tag cut straight
      # after the merge has to survive most of a CI run. 80 x 15 s = 1200 s covers
      # every observed CI duration. It is still bounded: a run that does not finish
      # ends in the timeout branch below with a warning, never an indefinite block.
      # The cost is release latency on that path only — when the artifact already
      # exists, which is the normal case (v0.1.10's artifact was uploaded 4m34s before
      # release-manifest started), the first lookup returns and the step is instant.
      #
      # A failed lookup is not evidence of absence. `gh run list` returning non-zero
      # (rate limit, 5xx) used to be folded into an empty list, so three such answers
      # 30 s apart asserted "no CI push run on main" about a run that existed. A
      # transport failure now retries without touching the absence counter, and it
      # breaks the streak: absence is only declared after IBEX_SMOKE_ABSENT_CHECKS
      # *consecutive* successful lookups (8 = 120 s, ~5x the 21 s observed between the
      # CI run and the release run for the same commit) return nothing for this commit.
      # Consecutive, not cumulative, because an unobserved interval in the middle of a
      # streak says nothing about what happened during it; a scattered empty-error-empty
      # pattern must never add up to a claim, and a commit whose run never exists
      # produces consecutive empties anyway, so the stricter rule costs nothing.
      #
      # Those are three different verdicts and the warnings keep them apart: a run that
      # was seen but never completed, absence proven by the streak, and "could not be
      # established" when the budget ran out with neither. Exhausted retries are not
      # evidence of absence, so one empty answer followed by a failing API reports that
      # the result is unknown — naming how many lookups failed and the last error — not
      # that CI never ran.
      #
      # A failed lookup also retries with exponential backoff and jitter (AGENTS.md
      # §8.3) rather than on the healthy 15 s poll, so a persistent 5xx is not retried
      # on a fixed drumbeat; a successful-but-empty lookup is not a failure and keeps
      # the fixed interval. The wall-clock budget is attempts x interval, computed once,
      # and every sleep is clipped to what is left of it, so growing delays cannot
      # stretch it: when it is spent the loop stops and reports instead of retrying
      # back-to-back.
      #
      # §8.3 also bounds *which* failures are retried: transient ones only, never auth
      # or validation failures. A revoked token, a token without the permission this
      # job needs, or a repository/argument that does not exist cannot recover by
      # waiting, so such an answer stops the loop on the first lookup instead of
      # spending the whole retry budget on it. The bundle still stays unverified: the
      # classification decides how hard to try, never what the result means.
      - name: Fetch the bundle smoke result for this commit
        id: bundle-smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Bounded wait for this commit's CI push run to finish. These knobs exist so
          # infra/scripts/test-ci-tiering.sh can exercise the loop without sleeping; the
          # defaults are the release behaviour and no workflow sets them.
          attempts="${IBEX_SMOKE_RUN_ATTEMPTS:-80}"   # 80 x 15 s = 1200 s
          interval="${IBEX_SMOKE_RUN_INTERVAL:-15}"
          # Consecutive *successful* lookups that find no run for this commit before the
          # step concludes the run does not exist. A lookup that fails never counts
          # towards this and resets it: a 5xx says nothing about whether a run exists, so
          # an unobserved interval in the middle of a short streak must not be summed
          # with the observations on either side of it.
          absent_checks="${IBEX_SMOKE_ABSENT_CHECKS:-8}"   # 8 x 15 s = 120 s
          # Retry delay for a *failed* lookup only. The delay doubles per *consecutive*
          # failure up to backoff_max, then carries equal jitter (uniform in
          # [delay/2, delay]) so concurrent releases do not collide on the same instant.
          # A successful-but-empty lookup is not a failure and keeps the fixed interval,
          # and it resets the exponent: backoff answers a *sustained* failure, so blips
          # scattered across a healthy run must not reach the cap that the same number of
          # failures in a row reach.
          backoff_base="${IBEX_SMOKE_BACKOFF_BASE:-$interval}"
          backoff_max="${IBEX_SMOKE_BACKOFF_MAX:-$(( interval * 4 ))}"   # 60 s
          (( attempts >= 1 )) || attempts=1
          (( interval >= 0 )) || interval=0
          (( absent_checks >= 1 )) || absent_checks=1
          (( backoff_base >= 0 )) || backoff_base=0
          (( backoff_max >= 1 )) || backoff_max=1
          # attempts x interval is a wall-clock budget, not a multiplier for the backoff.
          # It is computed once and every sleep is clipped to what is left of it; when it
          # is spent the loop stops and reports rather than retrying back-to-back. A zero
          # budget is only reachable through the test interval knob and means no
          # wall-clock bound was asked for, so the attempt count is the whole bound.
          budget=$(( attempts * interval ))
          slept=0

          run_id=""
          conclusion=""
          saw_run=0
          absent=0
          # Cumulative count of failed lookups, never reset: it is the number the final
          # 'N of M lookups failed' diagnostic quotes, and it must count every failure.
          errors=0
          # The backoff exponent's own counter: consecutive failures only, reset by any
          # successful lookup, because growth is a response to a sustained failure rather
          # than to a lifetime total.
          consecutive_errors=0
          last_error=""
          checks=0
          errlog="$(mktemp)"

          # AGENTS.md §8.3: retry transient failures only, never auth or validation
          # failures. Waiting cannot fix a bad credential, a token without the
          # permission this job needs, or a repository that does not exist, so those
          # stop the loop on the first answer; only a failure that may recover spends
          # the retry budget.
          #
          # The status code alone cannot decide it: GitHub answers 403 for rate
          # limiting *and* for a permission denial, and the two belong on opposite
          # sides. The message decides, and the rate-limit wording is matched first so
          # a 403 that says "rate limit" is never mistaken for a permission problem.
          #
          #   permanent — cannot recover by waiting, so the loop stops:
          #     bad credentials / must authenticate / authentication failed /
          #     authentication scope / the `gh auth login` hint (401),
          #     resource not accessible (covers "by personal access token" and
          #     "by integration"), permission denied, insufficient permissions or
          #     scope, not authorized (403 denial),
          #     400/404/422: a malformed repository, workflow or argument.
          #   transient — may recover, so the existing backoff applies:
          #     rate limit / secondary rate limit / abuse detection / 408 / 429
          #     (matched explicitly, before the permanent list), 5xx, DNS, TCP, TLS
          #     and timeout wording, and anything unrecognised.
          #
          # Unrecognised is transient on purpose. Retrying a permanent failure only
          # wastes budget, while calling a recoverable one permanent would turn a
          # release that could have verified itself into an unverified bundle.
          classify_lookup_failure() {
            local msg
            msg="$(tr '[:upper:]' '[:lower:]' <<<"${1:-}")"
            case "$msg" in
              *"rate limit"*|*"abuse detection"*|*"(http 408)"*|*"(http 429)"*)
                printf 'transient' ;;
              *"bad credentials"*|*"must authenticate"*|*"authentication failed"*|\
              *"authentication scope"*|*"gh auth login"*|*"gh auth refresh"*|\
              *"resource not accessible"*|*"permission denied"*|*"not authorized"*|\
              *"insufficient permission"*|*"insufficient scope"*|\
              *"(http 401)"*|*"(http 400)"*|*"(http 404)"*|*"(http 422)"*|\
              *"could not resolve to a repository"*)
                printf 'permanent' ;;
              *)
                printf 'transient' ;;
            esac
          }

          for (( attempt = 1; attempt <= attempts; attempt++ )); do
            checks="$attempt"
            if ! run_json="$(gh run list --repo "$REPOSITORY" --workflow ci.yml \
              --commit "$COMMIT" --event push --branch main --limit 5 \
              --json databaseId,headSha,status,conclusion 2>"$errlog")"; then
              errors=$(( errors + 1 ))
              consecutive_errors=$(( consecutive_errors + 1 ))
              absent=0
              last_error="$(tail -n 1 "$errlog" | tr -d '\r')"
              state="could not be queried (${last_error:-no error output})"
              # Classified on the whole stderr, reported on its last line: the
              # not-authenticated hint spans two lines and only the first names the
              # remedy ("please run: gh auth login"), so the last line alone would
              # miss a failure that cannot recover by waiting.
              if [[ "$(classify_lookup_failure "$(tr '\n' ' ' <"$errlog")")" == permanent ]]; then
                echo "::warning::the CI run list for ${COMMIT} failed permanently and is not retried (check ${attempt}/${attempts}): ${last_error:-no error output}; bundle status stays unverified"
                rm -f "$errlog"
                exit 0
              fi
              delay="$backoff_base"
              for (( backoff = 1; backoff < consecutive_errors && delay < backoff_max; backoff++ )); do
                delay=$(( delay * 2 ))
              done
              if (( delay > backoff_max )); then delay="$backoff_max"; fi
              half=$(( delay / 2 ))
              delay=$(( half + RANDOM % (delay - half + 1) ))
            else
              # The lookup succeeded, so whatever sustained failure the previous lookups
              # reported is over: the next failure starts again at the base delay.
              consecutive_errors=0
              delay="$interval"
              [[ -n "$run_json" ]] || run_json='[]'
              exists="$(jq -r --arg sha "$COMMIT" \
                'map(select(.headSha == $sha)) | length' <<<"$run_json")"
              run_id="$(jq -r --arg sha "$COMMIT" \
                'map(select(.headSha == $sha and .status == "completed")) | .[0].databaseId // empty' \
                <<<"$run_json")"
              if [[ -n "$run_id" ]]; then
                conclusion="$(jq -r --arg sha "$COMMIT" \
                  'map(select(.headSha == $sha and .status == "completed")) | .[0].conclusion // "unknown"' \
                  <<<"$run_json")"
                break
              fi
              if (( exists > 0 )); then
                saw_run=1
                absent=0
                state="is not complete yet"
              else
                absent=$(( absent + 1 ))
                state="has not appeared yet"
                if (( absent >= absent_checks )); then
                  break
                fi
              fi
            fi
            if (( attempt < attempts )); then
              remaining=$(( budget - slept ))
              if (( budget > 0 && remaining <= 0 )); then
                echo "CI push run on main for ${COMMIT} ${state} (check ${attempt}/${attempts}); the ${budget}s budget is spent, stopping"
                break
              fi
              if (( delay > remaining )); then delay="$remaining"; fi
              if (( delay > 0 )); then
                echo "CI push run on main for ${COMMIT} ${state} (check ${attempt}/${attempts}); waiting ${delay}s"
                sleep "$delay"
                slept=$(( slept + delay ))
              else
                echo "CI push run on main for ${COMMIT} ${state} (check ${attempt}/${attempts})"
              fi
            fi
          done
          rm -f "$errlog"

          # Three verdicts, never merged: seen-but-unfinished, proven absence, and
          # not established. Only the second is a claim about the world, and it reuses
          # the exact evidence the early exit above required.
          if [[ -z "$run_id" ]]; then
            if (( saw_run )); then
              echo "::warning::the CI push run on main for ${COMMIT} did not complete within the ${budget}s wait (${checks} lookups, the last still reporting it as unfinished); bundle status stays unverified"
            elif (( absent >= absent_checks )); then
              echo "::warning::no CI push run on main for ${COMMIT} was found in ${absent} consecutive lookups (CI was never run for the commit, or the run and its artifact are older than retention); bundle status stays unverified"
            else
              echo "::warning::whether a CI push run on main for ${COMMIT} exists could not be established: the run list could not be queried for ${errors} of ${checks} lookups and only ${absent} of the ${absent_checks} consecutive empty answers needed to report absence were seen (last error: ${last_error:-none}); bundle status stays unverified"
            fi
            exit 0
          fi

          echo "CI run ${run_id} for ${COMMIT} concluded: ${conclusion}"
          if [[ "$conclusion" != "success" ]]; then
            # A red run is not evidence for the smoke. The artifact may exist, but
            # promoting a bundle from a run that failed is exactly the overstatement
            # this manifest is supposed to prevent.
            echo "::warning::CI run ${run_id} for ${COMMIT} concluded ${conclusion}, so its bundle smoke is not evidence; bundle status stays unverified"
            exit 0
          fi
          if ! gh run download "$run_id" --repo "$REPOSITORY" \
            --name bundle-smoke-result --dir smoke-results; then
            echo "::warning::CI run ${run_id} carries no bundle-smoke-result artifact for ${COMMIT} (smoke skipped, failed before it wrote a result, or the artifact expired); bundle status stays unverified"
            exit 0
          fi
          jq -c . smoke-results/bundle-smoke-result.json
          echo "smoke_results=smoke-results/bundle-smoke-result.json" >> "$GITHUB_OUTPUT"

      - name: Generate release manifest
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SMOKE_RESULTS: ${{ steps.bundle-smoke.outputs.smoke_results }}
        run: |
          set -euo pipefail
          # Published set only: mcp-operator has a Dockerfile and no publish job,
          # and migrate (infra/migrations/Dockerfile) is not addressable as
          # services/<name>/Dockerfile, which is what this generator validates.
          #
          # --smoke-results is passed only when the artifact was downloaded. The
          # generator, not this step, decides promotion: it promotes a bundle only
          # for a `passed` result whose `commit` equals --commit and whose
          # `finished_at` parses as a tz-aware timestamp.
          smoke_args=()
          if [[ -n "${SMOKE_RESULTS}" ]]; then
            smoke_args=(--smoke-results "${SMOKE_RESULTS}")
          fi
          python3 infra/scripts/release-manifest.py \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --repository "$REPOSITORY" \
            --services auth,proxy,api,memory,embedder,worker,mcp-memory,context,console,relay \
            --output release-manifest.json \
            "${smoke_args[@]}"
      - name: Validate the release manifest against the schema
        run: |
          # Fail before a release is created or an asset is uploaded, so a
          # non-conforming manifest never reaches consumers.
          uv run --no-project --no-build \
            --with-requirements infra/scripts/release-manifest-test-requirements.txt \
            python3 infra/scripts/validate-release-manifest.py release-manifest.json
      - name: Download the per-image SBOMs from this release run
        # docker-publish runs as a called workflow inside this run, so its
        # image-sboms artifact is addressable here. No artifact means the SBOM
        # job did not succeed, which is a release blocker, not a warning.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sboms
          path: sboms
      - name: Bind every SBOM to the digest the manifest publishes
        # The manifest is the digest authority for this release. An SBOM that
        # does not name its own image digest is a file next to the release, not
        # an attachment to the image, so a mismatch fails the release rather
        # than shipping an unverifiable asset.
        run: |
          set -euo pipefail
          rc=0
          while read -r service; do
            sbom="sboms/${service}.sbom.spdx.json"
            digest="$(jq -r --arg s "$service" '.images[$s]' release-manifest.json)"
            if [[ ! -f "$sbom" ]]; then
              echo "::error::missing SBOM for ${service} (${digest})"
              rc=1
              continue
            fi
            if ! jq -e --arg d "$digest" \
              '[.packages[] | select(.SPDXID | startswith("SPDXRef-DocumentRoot"))]
               | length == 1 and .[0].versionInfo == $d' \
              "$sbom" >/dev/null; then
              echo "::error::${sbom} does not describe ${service}@${digest}"
              rc=1
              continue
            fi
            echo "ok      ${sbom} ${digest}"
          done < <(jq -r '.images | keys[]' release-manifest.json)
          if [[ "$rc" -ne 0 ]]; then
            exit 1
          fi
      - name: Ensure the GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.VERSION_RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Release $TAG"
          fi
      - name: Upload release manifest and per-image SBOMs
        env:
          GH_TOKEN: ${{ secrets.VERSION_RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # One asset per published image, named <service>.sbom.spdx.json and
          # bound to the digest in release-manifest.json by the step above.
          gh release upload "$TAG" release-manifest.json sboms/*.sbom.spdx.json --clobber
