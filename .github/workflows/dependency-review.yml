# Dependency Review Action
#
# Surfaces known-vulnerable dependency changes on PRs that touch lockfiles or go.mod.
name: Dependency Review

on:
  pull_request:

# SonarQube S8264: declare permissions per job, not at workflow scope.
permissions: {}

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deps: ${{ steps.detect.outputs.deps }}
      run_security: ${{ steps.detect.outputs.run_security }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          fetch-depth: '0'

  dependency-review:
    name: dependency-review
    needs: changes
    if: needs.changes.outputs.deps == 'true' || needs.changes.outputs.run_security == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash .github/scripts/dependency-review-scoped.sh
