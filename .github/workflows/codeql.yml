name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      force_full:
        description: Run analysis regardless of path filters
        required: false
        default: false
        type: boolean

# SonarQube S8264: declare permissions per job, not at workflow scope.
permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_go: ${{ steps.detect.outputs.run_go }}
      run_security: ${{ steps.detect.outputs.run_security }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'push' && '2' || '0' }}
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          fetch-depth: ${{ github.event_name == 'push' && '2' || '0' }}
          force-full: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full == true) }}

  analyze:
    name: CodeQL
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      needs.changes.outputs.run_go == 'true' ||
      needs.changes.outputs.run_security == 'true'
    permissions:
      security-events: write
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Python/JS added when services/memory and services/dashboard exist (ADR-0008).
        language: [go]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-buf

      - name: Generate protobuf stubs for CodeQL
        working-directory: packages/proto
        run: buf generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}
