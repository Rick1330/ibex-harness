name: Benchmarks

# Profiles: smoke (PRs — lightest), fast (daily cron Mon–Sat + main push),
# full (Sunday cron + workflow_dispatch). Successful main collects notify the
# benchmark bot so published history is daily, not Sunday-only.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'web/public/benchmarks/**'
      - '.github/workflows/benchmark.yml'
      - 'services/auth/**'
      - 'services/proxy/**'
      - 'packages/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark.yml"
      - "benchmarks/**"
      - "services/auth/**"
      - "services/proxy/**"
      - "packages/**"
      - "go.mod"
      - "go.sum"

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-benchmark-trigger:
    name: detect-benchmark-trigger
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # PRs and main pushes: proxy/auth/packages/benchmarks (skip docs-only).
      run_benchmarks: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (steps.detect.outputs.benchmarks == 'true' || steps.detect.outputs.go == 'true')) || (github.event_name == 'push' && (steps.detect.outputs.benchmarks == 'true' || steps.detect.outputs.go == 'true')) }}
      bench_profile: ${{ steps.profile.outputs.bench_profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '2' || '0' }}
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          fetch-depth: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '2' || '0' }}
      - id: profile
        name: Resolve bench profile
        run: |
          set -euo pipefail
          # smoke = PRs (fast signal), fast = daily/main push, full = Sunday/dispatch
          profile="fast"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            profile="smoke"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            profile="full"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            dow="$(date -u +%u)" # 1=Mon … 7=Sun
            if [ "$dow" = "7" ]; then
              profile="full"
            fi
          fi
          echo "bench_profile=$profile" >> "$GITHUB_OUTPUT"
          echo "Resolved BENCH_PROFILE=$profile"

  verify-benchmark-pipeline:
    name: verify-benchmark-pipeline
    needs: detect-benchmark-trigger
    if: needs.detect-benchmark-trigger.outputs.run_benchmarks == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Go benchmark pipeline unit tests
        run: go test ./benchmarks/go/...

      - name: Run Python benchmark pipeline unit tests
        run: python benchmarks/scripts/test_pipeline.py

      - name: Validate published benchmark data on main
        run: |
          path="web/public/benchmarks/benchmark-data.json"
          if [ -f "$path" ]; then
            python benchmarks/scripts/validate_published_data.py "$path"
          else
            echo "No published benchmark data yet; skipping validation."
          fi

  collect-proxy-benchmarks:
    name: collect-proxy-benchmarks
    needs: [verify-benchmark-pipeline, detect-benchmark-trigger]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BENCH_PROXY_PORT: "18082"
      POSTGRES_DSN: postgres://ibex:ibex@localhost:5432/ibex?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      BENCH_PROFILE: ${{ needs.detect-benchmark-trigger.outputs.bench_profile }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ibex
          POSTGRES_PASSWORD: ibex
          POSTGRES_DB: ibex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ibex -d ibex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-buf

      - name: Resolve profile knobs
        id: knobs
        run: |
          set -euo pipefail
          profile="${{ needs.detect-benchmark-trigger.outputs.bench_profile }}"
          if [ -z "$profile" ]; then
            profile="fast"
          fi
          run_proxy_http_bench=1
          k6_use_chat=0
          case "$profile" in
            full)
              echo "go_count=5" >> "$GITHUB_OUTPUT"
              echo "k6_vus=100" >> "$GITHUB_OUTPUT"
              echo "k6_duration=2m" >> "$GITHUB_OUTPUT"
              k6_use_chat=1
              ;;
            smoke)
              echo "go_count=1" >> "$GITHUB_OUTPUT"
              echo "k6_vus=15" >> "$GITHUB_OUTPUT"
              echo "k6_duration=15s" >> "$GITHUB_OUTPUT"
              run_proxy_http_bench=0
              ;;
            *)
              echo "go_count=2" >> "$GITHUB_OUTPUT"
              echo "k6_vus=25" >> "$GITHUB_OUTPUT"
              echo "k6_duration=30s" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "run_proxy_http_bench=$run_proxy_http_bench" >> "$GITHUB_OUTPUT"
          echo "k6_use_chat=$k6_use_chat" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "BENCH_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "Using BENCH_PROFILE=$profile"

      - name: Record overlap policy
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Concurrency / profile
          - Profile: \`${{ steps.knobs.outputs.profile }}\` (Go count=${{ steps.knobs.outputs.go_count }}, k6 ${{ steps.knobs.outputs.k6_vus }} VUs / ${{ steps.knobs.outputs.k6_duration }})
          - \`cancel-in-progress: true\` avoids overlapping noise for the same ref.
          EOF

      - name: Prepare output directories
        run: mkdir -p benchmarks/output

      - name: Load previous benchmark history from repo
        run: |
          src="web/public/benchmarks/benchmark-data.json"
          if [ -f "$src" ]; then
            cp "$src" benchmarks/output/prev-benchmark-data.json
            echo "Loaded previous benchmark history from ${src}"
          else
            echo '{"schema_version":1,"baseline_sha":"","runs":[]}' > benchmarks/output/prev-benchmark-data.json
            echo "No published benchmark history yet; starting fresh."
          fi

      - name: Generate protobuf stubs
        working-directory: packages/proto
        run: buf generate

      # Go stage microbenches do not need the live proxy stack — run them first.
      - name: Run Go microbenchmarks
        run: |
          set -euo pipefail
          go test ./benchmarks/go -run=^$ -bench=. -benchmem -count=${{ steps.knobs.outputs.go_count }} > benchmarks/output/go-bench.txt
          if [ "${{ steps.knobs.outputs.run_proxy_http_bench }}" = "1" ]; then
            go test ./services/proxy/internal/http -run=^$ -bench=BenchmarkProxy -benchmem -count=${{ steps.knobs.outputs.go_count }} >> benchmarks/output/go-bench.txt
          fi

      - name: Compare against previous benchmark with benchstat
        run: bash benchmarks/scripts/benchstat_compare.sh

      - name: Migrate database for benchmark proxy stack
        env:
          POSTGRES_MIGRATE_DSN: ${{ env.POSTGRES_DSN }}
        run: go run ./infra/migrations/postgres/cmd/migrate -command up

      - name: Start real proxy stack for load benchmark
        run: bash benchmarks/scripts/start_proxy_stack.sh

      - name: Run k6 load benchmark against proxy
        env:
          IBEX_DEV_TOKEN: ibex_pat_00000000-0000-0000-0000-000000000004_LOCALDEVELOPMENTONLY
          IBEX_DEV_AGENT_ID: "00000000-0000-0000-0000-000000000003"
        run: |
          chmod -R u+rwX benchmarks/output
          env_path_file="benchmarks/output/bench-proxy.env.path"
          docker_env_args=()
          if [ -f "$env_path_file" ]; then
            bench_env_file="$(tr -d '\r\n' < "$env_path_file")"
            if [ -n "$bench_env_file" ] && [ -f "$bench_env_file" ]; then
              docker_env_args+=(--env-file "$bench_env_file")
            fi
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network host \
            -v "$PWD:/work" -w /work \
            -e BASE_URL="http://127.0.0.1:${BENCH_PROXY_PORT}" \
            -e K6_HEALTH_PATH=/health \
            -e K6_USE_CHAT="${{ steps.knobs.outputs.k6_use_chat }}" \
            -e IBEX_DEV_TOKEN="${IBEX_DEV_TOKEN}" \
            -e IBEX_DEV_AGENT_ID="${IBEX_DEV_AGENT_ID}" \
            "${docker_env_args[@]}" \
            -e K6_VUS="${{ steps.knobs.outputs.k6_vus }}" \
            -e K6_DURATION="${{ steps.knobs.outputs.k6_duration }}" \
            grafana/k6:0.53.0 \
            run benchmarks/k6/proxy_load.js \
            --summary-trend-stats="med,p(90),p(95),p(99),p(99.9),min,max" \
            --summary-export benchmarks/output/k6-summary.json

      - name: Collect benchmark artifacts into schema
        env:
          GO_VERSION: ${{ steps.setup_go.outputs.go-version }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          BENCH_PROFILE: ${{ steps.knobs.outputs.profile }}
        run: python benchmarks/scripts/aggregate_metrics.py > benchmarks/output/collector-summary.json

      - name: Run regression gates
        env:
          BENCH_PROFILE: ${{ steps.knobs.outputs.profile }}
        run: |
          set +e
          python benchmarks/scripts/regression_gate.py | tee benchmarks/output/gate-summary.md
          status=${PIPESTATUS[0]}
          cat benchmarks/output/gate-summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          set -e
          python benchmarks/scripts/build_benchmark_data.py
          python benchmarks/scripts/generate_badge.py

      - name: Verify benchmark data payload
        run: |
          test -f benchmarks/output/benchmark-data.json
          test -f benchmarks/output/badge.svg
          test -f benchmarks/output/gate-result.json
          python benchmarks/scripts/validate_published_data.py benchmarks/output/benchmark-data.json

      - name: Require benchmark bot pin
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BENCHMARK_BOT_SHA: ${{ vars.BENCHMARK_BOT_SHA }}
        run: test -n "$BENCHMARK_BOT_SHA"

      - name: Require benchmark bot App credentials
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          APP_ID: ${{ secrets.BENCHMARK_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BENCHMARK_BOT_APP_PRIVATE_KEY }}
          INSTALLATION_ID: ${{ secrets.BENCHMARK_BOT_INSTALLATION_ID }}
        run: |
          test -n "$APP_ID" && test -n "$APP_PRIVATE_KEY" && test -n "$INSTALLATION_ID"

      - name: Download pinned benchmark bot binary
        id: bot_bin
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_BOT_SHA: ${{ vars.BENCHMARK_BOT_SHA }}
          BENCHMARK_BOT_RELEASE_TAG: ${{ vars.BENCHMARK_BOT_RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p benchmark-bot-bin
          asset="ibex-benchmark-bot-linux-amd64"
          short="${BENCHMARK_BOT_SHA:0:7}"
          tags=()
          if [ -n "${BENCHMARK_BOT_RELEASE_TAG:-}" ]; then
            tags+=("$BENCHMARK_BOT_RELEASE_TAG")
          fi
          tags+=("bot-${short}" "v${short}")
          source=build
          path=""
          for tag in "${tags[@]}"; do
            if gh release download "$tag" \
                --repo Rick1330/ibexharness-benchmark-bot \
                --pattern "$asset" \
                --dir benchmark-bot-bin 2>/dev/null; then
              chmod +x "benchmark-bot-bin/$asset"
              path="benchmark-bot-bin/$asset"
              source=release
              echo "Downloaded bot binary from release tag $tag"
              break
            fi
          done
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          if [ "$source" = "build" ]; then
            echo "No release asset for pin ${BENCHMARK_BOT_SHA}; will cargo build."
          fi

      - name: Checkout benchmark bot
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.bot_bin.outputs.source == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Rick1330/ibexharness-benchmark-bot
          ref: ${{ vars.BENCHMARK_BOT_SHA }}
          path: benchmark-bot
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.bot_bin.outputs.source == 'build'
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2.8.2
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.bot_bin.outputs.source == 'build'
        with:
          workspaces: benchmark-bot

      - name: Build benchmark bot (fallback)
        id: bot_build
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.bot_bin.outputs.source == 'build'
        run: |
          set -euo pipefail
          cd benchmark-bot
          cargo build --release --locked
          echo "path=${{ github.workspace }}/benchmark-bot/target/release/ibex-benchmark-bot" >> "$GITHUB_OUTPUT"

      - name: Build and post PR benchmark comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          APP_ID: ${{ secrets.BENCHMARK_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BENCHMARK_BOT_APP_PRIVATE_KEY }}
          INSTALLATION_ID: ${{ secrets.BENCHMARK_BOT_INSTALLATION_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BENCHMARK_DATA_PATH: ${{ github.workspace }}/benchmarks/output/benchmark-data.json
          GATE_RESULT_PATH: ${{ github.workspace }}/benchmarks/output/gate-result.json
          BOT_BIN_RELEASE: ${{ steps.bot_bin.outputs.path }}
          BOT_BIN_BUILD: ${{ steps.bot_build.outputs.path }}
        run: |
          set -euo pipefail
          if [ -n "${BOT_BIN_RELEASE:-}" ] && [ -x "$BOT_BIN_RELEASE" ]; then
            bot="$BOT_BIN_RELEASE"
          elif [ -n "${BOT_BIN_BUILD:-}" ] && [ -x "$BOT_BIN_BUILD" ]; then
            bot="$BOT_BIN_BUILD"
          else
            echo "benchmark bot binary not found" >&2
            exit 1
          fi
          "$bot" post-pr-comment \
            --benchmark-data "$BENCHMARK_DATA_PATH" \
            --gate-result "$GATE_RESULT_PATH"

      - name: Stop proxy stack
        if: always()
        run: bash benchmarks/scripts/stop_proxy_stack.sh

      - name: Upload benchmark data artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-data
          path: |
            benchmarks/output/benchmark-data.json
            benchmarks/output/badge.svg
            benchmarks/output/gate-summary.md
            benchmarks/output/gate-result.json
          if-no-files-found: error

  verify-published-benchmark-data:
    name: verify-published-benchmark-data
    needs: collect-proxy-benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base ref for integrity diff
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_BASE_REF: ${{ github.base_ref }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${BENCHMARK_BASE_REF}"

      - name: Download benchmark data artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-data
          path: benchmarks/output

      - name: Validate workflow benchmark artifact
        run: python benchmarks/scripts/validate_published_data.py benchmarks/output/benchmark-data.json

      - name: Reject manual benchmark JSON edits on PR branches
        env:
          BENCHMARK_BASE_REF: ${{ github.base_ref }}
          BENCHMARK_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash benchmarks/scripts/verify_pr_benchmark_integrity.sh "$BENCHMARK_BASE_REF"

  notify-benchmark-bot:
    name: notify-benchmark-bot
    needs: collect-proxy-benchmarks
    if: |
      vars.BENCHMARK_BOT_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Validate dispatch prerequisites
        env:
          DISPATCH_TOKEN: ${{ secrets.BENCHMARK_BOT_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "BENCHMARK_BOT_DISPATCH_TOKEN is required when BENCHMARK_BOT_ENABLED=true" >&2
            exit 1
          fi

      - name: Dispatch benchmark publish to bot repo
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_BOT_DISPATCH_TOKEN }}
          DISPATCH_RUN_ID: ${{ github.run_id }}
          DISPATCH_HEAD_SHA: ${{ github.sha }}
          DISPATCH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          gh api repos/Rick1330/ibexharness-benchmark-bot/dispatches \
            -f event_type=benchmark_main_complete \
            -f "client_payload[run_id]=${DISPATCH_RUN_ID}" \
            -f "client_payload[head_sha]=${DISPATCH_HEAD_SHA}" \
            -f "client_payload[run_number]=${DISPATCH_RUN_NUMBER}"

  record-fork-pr-benchmark:
    name: record-fork-pr-benchmark
    needs: collect-proxy-benchmarks
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Note fork PR publish limitation
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Benchmark publish skipped
          Fork PRs cannot receive automated benchmark-data commits.
          Download the `benchmark-data` artifact from this workflow run for preview and review.
          Docs CI overlays the artifact on pull requests when a successful Benchmarks run exists.
          EOF
