# Central path filters for dorny/paths-filter (see .github/actions/detect-changes).
python:
  - 'services/**/pyproject.toml'
  - 'services/**/uv.lock'
  - 'services/**/app/**'
  - 'services/**/tests/**'
  - 'benchmarks/memory/pii/**'
  - 'infra/scripts/release-manifest.py'
  - 'infra/scripts/test_release_manifest.py'
  - 'infra/release-manifest.schema.json'
  - 'infra/scripts/release-manifest-test.in'
  - 'infra/scripts/release-manifest-test-requirements.txt'
  - 'infra/scripts/verify_phase3_memory_e2e.sh'
  - 'infra/scripts/verify_phase3_memory_e2e_seed.py'
  - 'infra/scripts/memory-e2e-test-ci.sh'
  - 'infra/scripts/memory-test-ci.sh'
  - 'infra/scripts/phase3_e2e_stub_tei.py'
  - 'infra/scripts/e2e_phase35.sh'
  - 'infra/scripts/e2e-phase35-ci.sh'
  - 'infra/scripts/e2e_phase35_scenarios.py'
  - 'infra/scripts/e2e_phase35_lib.py'
  - 'infra/scripts/phase35_e2e_extraction_stub.py'
  - 'infra/scripts/phase35_e2e_safe_marker.py'
  - 'infra/scripts/api-*.sh'
  - 'infra/scripts/coverage-api-gate.sh'
  - 'infra/scripts/build-apierror-py-wheel.sh'
  - 'infra/scripts/build-ibex-idempotency-wheel.sh'
  - 'infra/scripts/idempotency-conformance-ci.sh'
  - 'infra/scripts/build-mcp-gateway-wheel.sh'
  - 'infra/scripts/build-mcp-runtime-wheel.sh'
  - 'infra/scripts/build-mcp-tool-descriptors-wheel.sh'
  - 'infra/scripts/mcp-gateway-test-ci.sh'
  - 'infra/scripts/mcp-tool-descriptors-test-ci.sh'
  - 'infra/scripts/mcp-operator-*.sh'
  - 'infra/tests/idempotency-conformance/**'
  - 'packages/apierror_py/**'
  - 'packages/authclient/**'
  - 'packages/ibex_async_db/**'
  - 'packages/ibex_idempotency/**'
  - 'packages/mcp_gateway/**'
  - 'packages/mcp_runtime/**'
  - 'packages/mcp_tool_descriptors/**'
  # Same rule as the `go` filter, for the half of the class the python-gated jobs run:
  # embedder-test-ci.sh, mcp-memory-test-ci.sh, worker-test-ci.sh,
  # worker-integration-test-ci.sh, context-uv-sync.sh and every coverage-*.sh gate
  # except coverage-api-gate.sh matched no filter, so editing one skipped the job that
  # executes it. The per-script entries above stay because they record which gate each
  # script drives; this rule is what makes the class safe, since dorny/paths-filter
  # ignores `!` rules under the default predicate-quantifier, so an exclusion list is not
  # available to narrow it.
  - 'infra/scripts/**'
go:
  - 'services/**'
  - 'packages/**'
  - 'go.mod'
  - 'go.sum'
  - 'infra/migrations/**'
  - '.golangci.yml'
  - '.golangci.depguard.yml'
  - '.golangci.complexity.yml'
  - '.github/tools/**'
  # The OpenAPI breaking gate diffs the snapshot against the PR base; it is driven by
  # the `go` filter (api-breaking runs only when run_go is true), so a PR that edits the
  # gate script itself must run the gate. Its siblings (api-test-ci.sh,
  # api-integration-test-ci.sh, api-uv-sync.sh) are exercised by run_python and stay in
  # the `python` filter above; api-breaking.sh is standalone, with no sourced helper.
  - 'infra/scripts/api-breaking.sh'
  # A script that drives a gate must trigger that gate. The jobs that execute a script
  # from infra/scripts/ are gated on run_go (or run_go || run_python), so before this
  # rule a PR editing go-test-gotestsum.sh, gocovmerge.py, coverage-gate.sh,
  # ensure-origin-main.sh or context-uv-sync.sh matched no filter, left the area
  # inactive, and the aggregate gate reported "Area inactive" instead of running the
  # gate that was edited. One directory-wide rule closes that class: over-running the
  # matrix for a changed gate is the correct failure mode, and it costs no more than the
  # services/** edit that already sets the same flags. The `python` filter repeats the
  # rule because the affected jobs split on run_go || run_python.
  - 'infra/scripts/**'
site:
  - 'site/**'
  - 'engineering/**'
  - 'CHANGELOG.md'
  - 'package.json'
  - '.npmrc'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'turbo.json'
  - '.github/workflows/ci.yml'
  - '.github/workflows/site-deploy.yml'
  - '.github/actions/setup-pnpm-node/**'
console:
  - 'services/console/**'
proto:
  - 'packages/proto/**'
docker:
  - 'services/**/Dockerfile'
  - 'services/*/Dockerfile'
  - '.hadolint.yaml'
workflows:
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/scripts/**'
deps:
  - 'go.mod'
  - 'go.sum'
  - 'pnpm-lock.yaml'
benchmarks:
  - 'benchmarks/**'
  - 'site/public/benchmarks/**'
  - '.github/workflows/benchmark.yml'
  - '.github/workflows/memory-benchmark.yml'
  - 'services/auth/**'
  - 'services/proxy/**'
  - 'services/memory/**'
  - 'go.mod'
  - 'go.sum'
docs:
  - '**/*.md'
  - '**/*.mdx'
  - 'site/content/**'
compose:
  - 'infra/compose/**'
  - 'infra/monitoring/**'
  - 'infra/helm/observability/**'
  - 'infra/scripts/verify_phase25.sh'
  - 'infra/scripts/e2e_phase25.sh'
  - 'infra/scripts/verify_phase3_memory_e2e.sh'
  - 'infra/scripts/memory-e2e-test-ci.sh'
  - 'infra/scripts/e2e_phase35.sh'
  - 'infra/scripts/e2e-phase35-ci.sh'
  - 'infra/scripts/e2e_phase35_scenarios.py'
  - 'infra/scripts/e2e_phase35_lib.py'
  - 'infra/scripts/phase35_e2e_extraction_stub.py'
  - 'infra/scripts/phase35_e2e_safe_marker.py'
  - 'infra/scripts/mcp-conformance.sh'
  - 'infra/scripts/observability-*.sh'
  # The bundle smoke is the only check that proves the supported profile migrates,
  # seeds, starts, and serves a tenant-isolated memory. It is driven by run_compose, so
  # a PR that edits the smoke script itself must run it instead of passing the gate with
  # a skipped job. Its only sibling is test-bundle-smoke-url.sh, which repo-guards runs
  # unconditionally and needs no filter entry.
  - 'infra/scripts/bundle-smoke.sh'
# Heavy Postgres PgVectorStore integration (memory-integration job).
memory:
  - 'services/memory/**'
  - 'infra/migrations/postgres/**'
  - 'infra/scripts/memory-*.sh'
  - 'infra/scripts/db-migrate.sh'
