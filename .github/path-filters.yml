# Central path filters for dorny/paths-filter (see .github/actions/detect-changes).
python:
  - 'services/**/pyproject.toml'
  - 'services/**/uv.lock'
  - 'services/**/app/**'
  - 'services/**/tests/**'
  - 'infra/scripts/verify_phase3_memory_e2e.sh'
  - 'infra/scripts/verify_phase3_memory_e2e_seed.py'
  - 'infra/scripts/memory-e2e-test-ci.sh'
  - 'infra/scripts/phase3_e2e_stub_tei.py'
go:
  - 'services/**'
  - 'packages/**'
  - 'go.mod'
  - 'go.sum'
  - 'infra/migrations/**'
  - '.golangci.yml'
  - '.golangci.depguard.yml'
  - '.golangci.complexity.yml'
  - '.github/tools/**'
web:
  - 'web/**'
  - 'CHANGELOG.md'
  - 'package.json'
  - '.npmrc'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'turbo.json'
  - '.github/workflows/ci.yml'
  - '.github/workflows/web-deploy.yml'
  - '.github/actions/setup-pnpm-web/**'
proto:
  - 'packages/proto/**'
docker:
  - 'services/**/Dockerfile'
  - 'services/*/Dockerfile'
  - '.hadolint.yaml'
workflows:
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/scripts/**'
deps:
  - 'go.mod'
  - 'go.sum'
  - 'pnpm-lock.yaml'
benchmarks:
  - 'benchmarks/**'
  - 'web/public/benchmarks/**'
  - '.github/workflows/benchmark.yml'
  - '.github/workflows/memory-benchmark.yml'
  - 'services/auth/**'
  - 'services/proxy/**'
  - 'services/memory/**'
  - 'go.mod'
  - 'go.sum'
docs:
  - '**/*.md'
  - '**/*.mdx'
compose:
  - 'infra/compose/**'
  - 'infra/monitoring/**'
  - 'infra/helm/observability/**'
  - 'infra/scripts/verify_phase25.sh'
  - 'infra/scripts/e2e_phase25.sh'
  - 'infra/scripts/verify_phase3_memory_e2e.sh'
  - 'infra/scripts/memory-e2e-test-ci.sh'
  - 'infra/scripts/mcp-conformance.sh'
  - 'infra/scripts/observability-*.sh'
# Heavy Postgres PgVectorStore integration (memory-integration job).
memory:
  - 'services/memory/**'
  - 'infra/migrations/postgres/**'
  - 'infra/scripts/memory-*.sh'
  - 'infra/scripts/db-migrate.sh'
