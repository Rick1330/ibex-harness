version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]

  # Root go.mod (single module for auth, proxy, infra, packages/proto tests).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]

  # CI-only go-licenses lockfile (see .github/tools/licenses/ and syft.yaml excludes).
  - package-ecosystem: gomod
    directory: "/.github/tools/licenses"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: ["dependencies", "go", "ci-tools"]
    ignore:
      # go-licenses v1.6.0 pulls go-git v4; no patched v4 release exists.
      # Excluded from SBOM and scoped in dependency-review allowlist — not runtime.
      - dependency-name: "gopkg.in/src-d/go-git.v4"

  - package-ecosystem: docker
    directory: /services/auth
    schedule:
      interval: daily
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker
    directory: /services/proxy
    schedule:
      interval: daily
    labels: ["dependencies", "docker"]

  # Docs site (pnpm workspace; lockfile at repo root).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "typescript"]

