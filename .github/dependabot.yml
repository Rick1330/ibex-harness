version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - github-actions
  groups:
    codeql-actions:
      patterns:
      - github/codeql-action*
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - go
- package-ecosystem: gomod
  directory: /.github/tools/licenses
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  labels:
  - dependencies
  - go
  - ci-tools
  ignore:
  - dependency-name: gopkg.in/src-d/go-git.v4
- package-ecosystem: docker
  directories:
  - /services/auth
  - /services/proxy
  schedule:
    interval: daily
  labels:
  - dependencies
  - docker
  groups:
    golang-builder:
      patterns:
      - golang
- package-ecosystem: pip
  directory: /services/memory
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - python
  - area/memory
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - area/web
  ignore:
  # No patched release yet (advisory last-affected <=2.0.2; npm latest still 2.0.2).
  # Accepted via .trivyignore + osv-scanner.toml; Dependabot alerts 24/25.
  # Remove this ignore when image-size publishes >2.0.2.
  - dependency-name: image-size
    versions:
    - "<=2.0.2"
