version: "2"
run:
  timeout: 3m
  relative-path-mode: gomod
formatters:
  enable:
    - gofmt
    - goimports
linters:
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - funlen
    - gocognit
  disable:
    - gocyclo
    - prealloc
  settings:
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
    funlen:
      lines: 40
      statements: 30
    gocognit:
      min-complexity: 10
  exclusions:
    warn-unused: true
    rules:
      # Table-driven tests routinely exceed funlen; Wave 2+ shrinks prod hotspots (MF-016).
      - path: _test\.go
        linters:
          - funlen
          - gocognit
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Grandfather existing prod complexity; fail on new/changed files vs main (MF-002).
  # whole-files: any edit in a file re-evaluates the entire file so body-only
  # complexity regressions are not skipped by line-diff filtering.
  new: true
  new-from-merge-base: main
  whole-files: true
