# Production overrides — require real digests and off-cluster S3.
# Until CI injects real mixed-hex digests, `check-helm-digest-placeholders.sh`
# MUST fail on this overlay (sentinel alphabet is intentional).
# Do not deploy production with these stubs.
deployment:
  profile: production
proxy:
  environment: production
  llm:
    mode: live
    provider: openai
    secretName: ibex-proxy-provider
    apiKeyKey: openai-api-key
  redis:
    secretName: ibex-redis
    urlKey: redis-url
images:
  proxy: "ghcr.io/rick1330/ibex-harness/proxy:main@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  auth: "ghcr.io/rick1330/ibex-harness/auth:main@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
  api: "ghcr.io/rick1330/ibex-harness/api:main@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
  worker: "ghcr.io/rick1330/ibex-harness/worker:main@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"
  memory: "ghcr.io/rick1330/ibex-harness/memory:main@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
  embedder: "ghcr.io/rick1330/ibex-harness/embedder:main@sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"
  mcpMemory: "ghcr.io/rick1330/ibex-harness/mcp-memory:main@sha256:1111111111111111111111111111111111111111111111111111111111111111"
  migrate: "ghcr.io/rick1330/ibex-harness/migrate:main@sha256:2222222222222222222222222222222222222222222222222222222222222222"
hpa:
  minReplicas: 3
  maxReplicas: 12
backup:
  s3Endpoint: "https://s3.amazonaws.com"  # production object storage
  s3Bucket: "ibex-pgbackrest-prod"
kyverno:
  verifyImages: true
