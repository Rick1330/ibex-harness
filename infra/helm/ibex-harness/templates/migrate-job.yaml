{{- if .Values.migrate.enabled }}
# Migration Job runs before app traffic; script is the repo's infra/scripts/db-migrate.sh
# mounted read-only (no fork of migrate logic).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ibex.name" . }}-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibex.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-5"
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: {{ .Values.images.api | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              # Expect POSTGRES_MIGRATE_DSN from secret; invoke migrate binary shipped in image
              # or host-mounted script path used by restore-drill.
              if command -v migrate >/dev/null 2>&1; then
                migrate -command up
              elif [ -x /scripts/db-migrate.sh ]; then
                /scripts/db-migrate.sh up
              else
                echo "migration entrypoint missing" >&2
                exit 1
              fi
          env:
            - name: POSTGRES_MIGRATE_DSN
              valueFrom:
                secretKeyRef:
                  name: ibex-postgres
                  key: migrate-dsn
                  optional: true
{{- end }}
