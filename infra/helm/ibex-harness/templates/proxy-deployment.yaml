{{- $deploymentProfile := required "deployment.profile must be explicitly set" .Values.deployment.profile -}}
{{- if ne $deploymentProfile .Values.proxy.environment -}}
{{- fail (printf "deployment.profile %q must match proxy.environment %q" $deploymentProfile .Values.proxy.environment) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibex.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  {{- include "ibex.replicas" . | nindent 2 }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  {{- include "ibex.strategy" . | nindent 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
        ibex.io/metrics: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: proxy
          image: {{ .Values.images.proxy | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: {{ .Values.service.proxy.port }}
          env:
            - name: IBEX_DEPLOY_IMAGE_DIGEST
              value: {{ include "ibex.imageDigest" .Values.images.proxy | quote }}
            - name: IBEX_ENV
              value: {{ required "proxy.environment must be explicitly set" .Values.proxy.environment | quote }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxy.redis.secretName | quote }}
                  key: {{ .Values.proxy.redis.urlKey | quote }}
                  optional: {{ eq .Values.proxy.environment "development" }}
            - name: IBEX_AUTH_GRPC_ADDR
              value: "auth:{{ .Values.service.auth.grpc }}"
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.resources.proxy | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibex.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.proxy.port }}
      targetPort: http
