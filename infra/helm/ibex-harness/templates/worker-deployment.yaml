apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibex.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- include "ibex.replicas" . | nindent 2 }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  {{- include "ibex.strategy" . | nindent 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        ibex.io/metrics: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: {{ .Values.images.worker | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: {{ .Values.service.worker.port }}
          env:
            - name: IBEX_DEPLOY_IMAGE_DIGEST
              value: {{ include "ibex.imageDigest" .Values.images.worker | quote }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.enqueue.secretName | quote }}
                  key: {{ .Values.worker.enqueue.redisUrlKey | quote }}
            - name: IBEX_WORKER_ENQUEUE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.enqueue.secretName | quote }}
                  key: {{ .Values.worker.enqueue.enqueueTokenKey | quote }}
            - name: IBEX_WORKER_ENQUEUE_HOST
              value: "0.0.0.0"
            - name: IBEX_WORKER_ENQUEUE_PORT
              value: {{ .Values.service.worker.port | quote }}
          {{- if .Values.worker.enqueue.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            # Worker enqueue HTTP exposes /health only (no /ready yet; ADR-0022 residual).
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibex.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  selector:
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.worker.port }}
      targetPort: http
