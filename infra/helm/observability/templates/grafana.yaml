apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: {{ .Values.images.grafana | quote }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            {{- if .Values.grafana.anonymousAdmin }}
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            {{- else }}
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            {{- if .Values.grafana.existingSecret }}
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.existingSecret | quote }}
                  key: admin-password
            {{- end }}
            {{- end }}
          ports:
            - containerPort: 3000
              name: http
          resources:
            {{- toYaml .Values.resources.grafana | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
