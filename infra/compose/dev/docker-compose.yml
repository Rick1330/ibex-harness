# Local development stack. Every application service connects on a capability
# login, never the owner `ibex`: the worker asserts `ibex_worker` at process init
# and refuses the owner, because the migration owner is a superuser and
# `FORCE ROW LEVEL SECURITY` does not cover superusers. Migration 000064 creates
# the capability roles locked (no verifier, CONNECTION LIMIT 0), so the one-shot
# `provision` service sets the verifiers and lifts the limits before any service
# that logs in as one starts.
#
# The passwords below are fixed test values for this throwaway dev database. They
# are deliberately not the owner credential and are pairwise distinct, which is
# what provision enforces; they also match the harness scripts
# (infra/scripts/lib/pgcapability.sh) so a local database provisioned by either
# side stays usable by the other. A deployment profile generates its own instead
# (see infra/compose/v1-single-node/gen-v1-secrets.sh).
services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: ibex-dev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibex}
      POSTGRES_DB: ${POSTGRES_DB:-ibex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ibex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibex} -d ${POSTGRES_DB:-ibex}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: docker.io/redis/redis-stack:7.4.0-v1
    container_name: ibex-dev-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ibex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:24.8.14.39
    container_name: ibex-dev-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ibex}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_HOST_PORT:-9002}:9000"
    volumes:
      - ibex_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -Fxq Ok."]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: docker.io/alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
    container_name: ibex-dev-minio-init
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 65532:65532 /data"]
    volumes:
      - ibex_minio_data:/data
    restart: "no"

  minio:
    # MinIO stopped publishing community images to Docker Hub and Quay.
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    container_name: ibex-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - ibex_minio_data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # The pinned image ships no curl, wget, or python: mc is the only HTTP
      # client, and a curl probe exits 127 forever. `mc ready local` probes
      # /minio/health/cluster through the image's built-in `local` alias
      # (localhost:9000) and fails when the server is gone.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot migration. `make db-migrate` runs the same command from the host;
  # both are idempotent, and putting it in the stack means `make compose-dev-up`
  # yields a schema the worker can use instead of depending on a remembered
  # manual step.
  migrate:
    build:
      context: ../../..
      dockerfile: infra/migrations/Dockerfile
    environment:
      POSTGRES_MIGRATE_DSN: postgres://${POSTGRES_USER:-ibex}:${POSTGRES_PASSWORD:-ibex}@postgres:5432/${POSTGRES_DB:-ibex}?sslmode=disable
    command: ["up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot capability-login provisioning. It runs after `migrate` because the
  # roles must already exist, and the worker waits for it: if provisioning fails,
  # Compose refuses to start the worker rather than letting it connect as a login
  # the binary would reject anyway. `make compose-dev-up` retries it on the next
  # run; provision is idempotent.
  provision:
    build:
      context: ../../..
      dockerfile: infra/migrations/Dockerfile
    environment:
      # provision derives the owner credential from this DSN and refuses any
      # capability secret that equals it.
      POSTGRES_MIGRATE_DSN: postgres://${POSTGRES_USER:-ibex}:${POSTGRES_PASSWORD:-ibex}@postgres:5432/${POSTGRES_DB:-ibex}?sslmode=disable
      # Fixed test credentials; all four are required by provision even though
      # this stack only runs the worker.
      IBEX_AUTH_DB_PASSWORD: capability-test-only-auth
      IBEX_RUNTIME_DB_PASSWORD: capability-test-only-runtime
      IBEX_WORKER_DB_PASSWORD: capability-test-only-worker
      IBEX_BOOTSTRAP_DB_PASSWORD: capability-test-only-bootstrap
    command: ["provision"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      # compose file lives in infra/compose/dev → three levels up is repo root
      context: ../../..
      dockerfile: services/worker/Dockerfile
    container_name: ibex-dev-worker
    ports:
      - "${IBEX_WORKER_METRICS_PORT:-8006}:8006"
      # Host loopback only; non-loopback publish needs an explicit compose override + token.
      - "127.0.0.1:${IBEX_WORKER_ENQUEUE_PORT:-8007}:8007"
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_DB_QUEUE: "1"
      REDIS_DB_RESULTS: "3"
      # The worker asserts this login at process init (services/worker/app/db.py)
      # and refuses to boot on the owner. Overriding it with the owner login fails
      # the worker instead of silently re-enabling the RLS bypass.
      POSTGRES_DSN: ${IBEX_WORKER_DATABASE_URL:-postgres://ibex_worker:capability-test-only-worker@postgres:5432/${POSTGRES_DB:-ibex}?sslmode=disable}
      IBEX_WORKER_METRICS_PORT: "8006"
      IBEX_WORKER_ENQUEUE_PORT: "8007"
      IBEX_WORKER_ENQUEUE_HOST: "0.0.0.0"
      IBEX_WORKER_ENQUEUE_API_TOKEN: ${IBEX_WORKER_ENQUEUE_API_TOKEN:-dev-enqueue-token}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      provision:
        condition: service_completed_successfully

  worker-beat:
    build:
      context: ../../..
      dockerfile: services/worker/Dockerfile
    container_name: ibex-dev-worker-beat
    command:
      [
        "celery",
        "-A",
        "app.celery_app:celery_app",
        "beat",
        "--loglevel=info",
        "--schedule=/var/lib/ibex/celerybeat/celerybeat-schedule",
      ]
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_DB_QUEUE: "1"
      REDIS_DB_RESULTS: "3"
      # Beat runs the same Celery app as the worker, so it carries the worker's
      # login rather than a second identity: a beat-side database use must not
      # silently start on the owner the worker is forbidden to use.
      POSTGRES_DSN: ${IBEX_WORKER_DATABASE_URL:-postgres://ibex_worker:capability-test-only-worker@postgres:5432/${POSTGRES_DB:-ibex}?sslmode=disable}
    depends_on:
      redis:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[c]elery.*beat' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ibex_postgres_data:
  ibex_redis_data:
  ibex_clickhouse_data:
  ibex_minio_data:
