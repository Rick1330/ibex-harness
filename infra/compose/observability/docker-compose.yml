# IBEX local observability stack (ADR-0051 / Phase 2.5.G7)
# Scrapes host-published service ports via host.docker.internal.
#
#   make observability-up
#   make observability-smoke
#   make observability-down

name: ibex-observability

services:
  prometheus:
    image: prom/prometheus@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    container_name: ibex-obs-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ../../monitoring/prometheus/scrape-auth:/etc/prometheus/scrape-auth:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${IBEX_OBS_PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready | grep -qi ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - observability

  alertmanager:
    image: prom/alertmanager@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: ibex-obs-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${IBEX_OBS_ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:37fa87091cfaaec7234a27e4e395a40c31c2bfaea97a349a4afef6d9e9681197
    container_name: ibex-obs-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../../monitoring/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${IBEX_OBS_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${IBEX_OBS_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${IBEX_OBS_OTEL_HEALTH_PORT:-13133}:13133"
    depends_on:
      - tempo
      - loki
    # Distroless image has no shell/wget; readiness is checked from the host
    # by make observability-smoke (GET :13133).
    healthcheck:
      disable: true
    networks:
      - observability

  tempo:
    image: grafana/tempo@sha256:ef4384fce6e8ad22b95b243d8fc165628cda655376fd50e7850536ad89d71d50
    container_name: ibex-obs-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../../monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${IBEX_OBS_TEMPO_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - observability

  loki:
    image: grafana/loki@sha256:09a53b4a4ff81ffcd8f13886df19d33fac7a8d3aaf952e3c7e66cbade5b2fc31
    container_name: ibex-obs-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../../monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${IBEX_OBS_LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - observability

  grafana:
    image: grafana/grafana@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    container_name: ibex-obs-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${IBEX_OBS_GRAFANA_ADMIN_PASSWORD:-ibex-local-only}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${IBEX_OBS_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -qi ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observability

volumes:
  prometheus_data:
  alertmanager_data:
  tempo_data:
  loki_data:
  grafana_data:

networks:
  observability:
    name: ibex-observability
    driver: bridge
