name: ibex-observability
services:
  prometheus:
    image: docker.io/prom/prometheus@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    container_name: ibex-obs-prometheus
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ../../../monitoring/prometheus/prometheus-host.yml:/etc/prometheus/prometheus.yml:ro
      - ../../../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ../../../monitoring/prometheus/scrape-auth:/etc/prometheus/scrape-auth:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready | grep -qi ready"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on: [alertmanager]
  alertmanager:
    image: docker.io/prom/alertmanager@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: ibex-obs-alertmanager
    network_mode: host
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.listen-address=127.0.0.1:19094"]
    volumes:
      - ../../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib@sha256:37fa87091cfaaec7234a27e4e395a40c31c2bfaea97a349a4afef6d9e9681197
    container_name: ibex-obs-otel-collector
    network_mode: host
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../../../monitoring/otel/collector-host.yaml:/etc/otelcol/config.yaml:ro
  tempo:
    image: docker.io/grafana/tempo@sha256:ef4384fce6e8ad22b95b243d8fc165628cda655376fd50e7850536ad89d71d50
    container_name: ibex-obs-tempo
    network_mode: host
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../../../monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
  loki:
    image: docker.io/grafana/loki@sha256:09a53b4a4ff81ffcd8f13886df19d33fac7a8d3aaf952e3c7e66cbade5b2fc31
    container_name: ibex-obs-loki
    network_mode: host
    command: ["-config.file=/etc/loki/loki-host.yaml"]
    volumes:
      - ../../../monitoring/loki/loki-host.yaml:/etc/loki/loki-host.yaml:ro
      - loki_data:/loki
  grafana:
    image: docker.io/grafana/grafana@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    container_name: ibex-obs-grafana
    network_mode: host
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${IBEX_OBS_GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ../../../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../../monitoring/grafana/provisioning/datasources/datasources-host.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ../../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
volumes:
  prometheus_data:
  alertmanager_data:
  tempo_data:
  loki_data:
  grafana_data:
