# IBEX Harness — v1-single-node supported profile (ADR-0097).
#
# One Compose project, one internal network, one published port: the edge HTTPS
# terminator. Everything else is reachable only by service name on the bridge.
# The one-shot `migrate` service gates every required application container, and
# the one-shot `provision` service gates every container that authenticates with a
# capability login. A failed migration or a failed provision stops the profile
# rather than producing a partial start.
#
# Privileged inputs (never committed) are produced by `make v1-secrets`
# (infra/scripts/gen-v1-secrets.sh) into infra/compose/v1-single-node/.env and
# ./secrets/. The profile keeps its own env file so the repository's development
# `.env` cannot leak unrelated values into this stack.
#
# Deliberate transport posture (ADR-0097 §4):
#   - context shares the proxy network namespace and binds loopback plaintext only
#   - AuthService gRPC carries TLS with the per-install CA (ca.crt)
#   - internal HTTP service tokens stay on the Compose bridge; ports unpublished
name: ibex-v1-single-node

services:
  # Postgres carries pgBackRest so the archive command and every base backup
  # run inside the cluster container (see ./postgres/Dockerfile). The upstream
  # base image is pinned by digest there and repeated here so the pin is visible
  # from the Compose file:
  #   pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
  postgres:
    build:
      context: ./postgres
    image: ibex-v1-postgres:local
    restart: unless-stopped
    # The image runs as uid 999 (see its Dockerfile), so the data volume must
    # already belong to that user. This one-shot is the only place root is used.
    depends_on:
      postgres-volume-init:
        condition: service_completed_successfully
    # Continuous WAL archiving is the whole point of this profile's backup path
    # (ADR-0097 §5). archive-async is deliberately off in the stanza config: a
    # failed push must block WAL recycling so the failure is visible in
    # pg_stat_archiver instead of being retried behind the server's back.
    #
    # restore_command is NOT set here. Recovery parameters only exist for the
    # duration of a restore, where pgBackRest writes them into
    # postgresql.auto.conf; a running server must never carry one.
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_timeout=60"
      - "-c"
      - "archive_command=pgbackrest --config=/etc/pgbackrest/pgbackrest.conf --stanza=ibex-main archive-push %p"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; run make v1-secrets}
      POSTGRES_DB: ${POSTGRES_DB:-ibex}
      # Repository credentials travel as environment variables, not in the
      # stanza config: the config is bind-mounted read-only into a container
      # that runs as uid 999, so it has to be world-readable, and a
      # world-readable file must not carry a secret. pgBackRest maps
      # PGBACKREST_<OPTION> onto the matching option.
      PGBACKREST_REPO1_S3_KEY: ${IBEX_OBJECTSTORE_ACCESS_KEY:?IBEX_OBJECTSTORE_ACCESS_KEY is required; run make v1-secrets}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${IBEX_OBJECTSTORE_SECRET_KEY:?IBEX_OBJECTSTORE_SECRET_KEY is required; run make v1-secrets}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:?PGBACKREST_REPO1_CIPHER_PASS is required; run make v1-secrets}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Generated by `make v1-secrets` from .env. Mount the containing directory,
      # not the single file: the generator replaces the file with `mv -f`, and a
      # file bind mount pins the old inode, so a running container would keep
      # archiving to the previous repository. The in-container path is unchanged.
      - ../../backup/pgbackrest:/etc/pgbackrest:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal
    # No depends_on for the object store on purpose: an archive-push failure
    # leaves WAL in pg_wal and retries, so a repository outage must not stop the
    # database. It is an alarm, not a startup gate.

  redis:
    image: redis:7.4.2@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required; run make v1-secrets}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  # S3-compatible backup repository for pgBackRest.
  #
  # Chainguard's MinIO build, pinned by digest. MinIO stopped publishing
  # community images to Docker Hub and Quay (both now deny anonymous pulls), so
  # the upstream image cannot be pinned; this build is the repository's
  # established object store and is the same pin the dev stack uses
  # (infra/compose/dev/docker-compose.yml). The pgBackRest configuration stays
  # vendor-neutral: point repo1-s3-endpoint at any S3-compatible deployment and
  # nothing else in this profile changes.
  objectstore:
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    restart: unless-stopped
    # Without a command the image prints its help text and exits 0, so the
    # server subcommand is required, not implied. The console listener exists
    # only inside the bridge; no port is published.
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # MinIO authenticates every request against this one root identity, and
      # pgBackRest sends the same pair as repo1-s3-key/-key-secret. No anonymous
      # access exists.
      MINIO_ROOT_USER: ${IBEX_OBJECTSTORE_ACCESS_KEY:?IBEX_OBJECTSTORE_ACCESS_KEY is required; run make v1-secrets}
      MINIO_ROOT_PASSWORD: ${IBEX_OBJECTSTORE_SECRET_KEY:?IBEX_OBJECTSTORE_SECRET_KEY is required; run make v1-secrets}
    volumes:
      - objectstore-data:/data
    healthcheck:
      # The S3 API, not the console port: a healthy console with a dead API
      # would let every archive-push fail while the container reports healthy.
      # mc is the only HTTP client in the image; `mc ready local` probes
      # /minio/health/cluster on localhost:9000 and exits non-zero when the
      # server is gone.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      objectstore-volume-init:
        condition: service_completed_successfully
    networks:
      - internal

  # The MinIO image runs as uid 65532 and cannot write a volume the runtime
  # created for root. This one-shot hands the volume to that uid before the
  # server starts, so a fresh install on a rootful runtime cannot fail on
  # permissions. It mirrors the dev stack's `minio-init` sidecar; the chown is
  # idempotent, so a restart costs one directory walk.
  objectstore-volume-init:
    image: docker.io/alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 65532:65532 /data"]
    volumes:
      - objectstore-data:/data
    networks:
      - internal

  # The postgres image runs as uid 999, so the data volume must be owned by that
  # user before the server starts. Root is needed only here: the upstream
  # entrypoint would otherwise do this chown itself, which is why it starts as
  # root. Doing it in a one-shot keeps root out of the long-running container.
  # On a volume that a previous root-entrypoint run already chowned this is a
  # no-op, so existing installs upgrade without a data migration.
  postgres-volume-init:
    image: docker.io/alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 999:999 /data"]
    volumes:
      - postgres-data:/data
    networks:
      - internal

  # One-shot bucket provisioning. pgBackRest never creates a bucket, so the
  # repository must exist before the first stanza-create or archive-push.
  #
  # `ibex-sessions` is not created here: no service in this profile sets the
  # worker's S3_* variables, so the worker never writes to object storage. An
  # operator who enables that path must create the bucket with `mc mb`.
  objectstore-init:
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      # mc reads credentials from MC_HOST_<alias> in the environment, so the
      # secret never appears on its command line inside the container.
      MC_HOST_store: http://${IBEX_OBJECTSTORE_ACCESS_KEY:?IBEX_OBJECTSTORE_ACCESS_KEY is required; run make v1-secrets}:${IBEX_OBJECTSTORE_SECRET_KEY:?IBEX_OBJECTSTORE_SECRET_KEY is required; run make v1-secrets}@objectstore:9000
    command:
      - |
        # Re-creating an existing bucket is a no-op with --ignore-existing, so
        # the one-shot stays idempotent across restarts. `mc stat` is the
        # verification: it exits 0 only when the bucket is present and
        # listable with these credentials. The image carries no grep, so the
        # check is the command's exit status, not a text match.
        mc mb --ignore-existing store/ibex-pgbackrest
        mc stat store/ibex-pgbackrest
    depends_on:
      objectstore:
        condition: service_healthy
    networks:
      - internal

  migrate:
    build:
      context: ../../..
      dockerfile: infra/migrations/Dockerfile
    environment:
      POSTGRES_MIGRATE_DSN: postgres://${POSTGRES_USER:-ibex}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ibex}?sslmode=disable
    command: ["up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # One-shot capability-login provisioning: one transaction that sets the SCRAM
  # verifier and CONNECTION LIMIT for every capability role. It runs after the
  # migrations because the roles must already exist.
  #
  # Failure mode is deliberately half-up: if this exits non-zero, Compose refuses
  # to start the services that depend on it, so postgres, redis, the edge, the
  # migrator and the one-shots are up while no application service connects. That
  # is the safe half: nothing is serving, and `make v1-provision` retries the
  # credential write without a teardown.
  #
  # The four secrets are required at start (`:?`) rather than defaulted. A default
  # would be a shared credential, and the binary would still refuse it; failing
  # here names the remedy instead of printing provision's redacted error.
  provision:
    build:
      context: ../../..
      dockerfile: infra/migrations/Dockerfile
    environment:
      # provision derives the owner credential from this DSN, so it must be the
      # same owner DSN `migrate` uses. It also refuses any capability secret that
      # equals the owner credential.
      POSTGRES_MIGRATE_DSN: postgres://${POSTGRES_USER:-ibex}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ibex}?sslmode=disable
      IBEX_RUNTIME_DB_PASSWORD: ${IBEX_RUNTIME_DB_PASSWORD:?IBEX_RUNTIME_DB_PASSWORD is required; run make v1-secrets}
      IBEX_AUTH_DB_PASSWORD: ${IBEX_AUTH_DB_PASSWORD:?IBEX_AUTH_DB_PASSWORD is required; run make v1-secrets}
      IBEX_WORKER_DB_PASSWORD: ${IBEX_WORKER_DB_PASSWORD:?IBEX_WORKER_DB_PASSWORD is required; run make v1-secrets}
      IBEX_BOOTSTRAP_DB_PASSWORD: ${IBEX_BOOTSTRAP_DB_PASSWORD:?IBEX_BOOTSTRAP_DB_PASSWORD is required; run make v1-secrets}
    # The binary accepts a bare positional command (`migrate provision`), which is
    # what the image entrypoint forwards here.
    command: ["provision"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  # One-shot identity bootstrap: creates the org/user/agent, the memory service
  # token, and writes one admin PAT to the host bind mount (never to stdout).
  # Same image as auth, entrypoint overridden. Context and worker gate on it so
  # the memory token row exists before their first call; nothing waits for the
  # PAT file.
  bootstrap:
    image: ibex-v1-auth:local
    build:
      context: ../../..
      dockerfile: services/auth/Dockerfile
    entrypoint: ["/usr/local/bin/ibex-bootstrap"]
    restart: "no"
    environment:
      IBEX_ENV: ${IBEX_ENV:-staging}
      POSTGRES_DSN: postgres://ibex_bootstrap:${IBEX_BOOTSTRAP_DB_PASSWORD:?IBEX_BOOTSTRAP_DB_PASSWORD is required; run make v1-secrets}@postgres:5432/${POSTGRES_DB:-ibex}?sslmode=disable
      IBEX_BOOTSTRAP_ORG_NAME: ${IBEX_BOOTSTRAP_ORG_NAME:-IBEX Harness}
      IBEX_BOOTSTRAP_ORG_SLUG: ${IBEX_BOOTSTRAP_ORG_SLUG:-ibex}
      IBEX_BOOTSTRAP_USER_EMAIL: ${IBEX_BOOTSTRAP_USER_EMAIL:-owner@ibex.local}
      IBEX_BOOTSTRAP_USER_NAME: ${IBEX_BOOTSTRAP_USER_NAME:-Owner}
      IBEX_BOOTSTRAP_AGENT_NAME: ${IBEX_BOOTSTRAP_AGENT_NAME:-Default Agent}
      IBEX_BOOTSTRAP_AGENT_SLUG: ${IBEX_BOOTSTRAP_AGENT_SLUG:-default}
      IBEX_BOOTSTRAP_PAT_NAME: ${IBEX_BOOTSTRAP_PAT_NAME:-Bootstrap PAT}
      IBEX_MEMORY_API_TOKEN: ${IBEX_MEMORY_API_TOKEN:?IBEX_MEMORY_API_TOKEN is required; run make v1-secrets}
      # The PAT is written to a host bind mount (0700) so it survives the
      # one-shot's exit; a tmpfs would be discarded with the container and the
      # credential could never be recovered. The bootstrap never prints it.
      IBEX_BOOTSTRAP_PAT_FILE: /run/ibex/bootstrap.pat
    # Write as container root so a rootless runtime maps the write to the
    # operator's own UID inside the 0700 directory. A rootful runtime writes as
    # root instead; `make v1-bootstrap-pat` then reads the file through this
    # image, so the operator does not need sudo.
    user: "0:0"
    volumes:
      # :Z relabels the directory for container access on an SELinux host; it is
      # ignored where SELinux is disabled.
      - ./bootstrap:/run/ibex:Z
    depends_on:
      provision:
        condition: service_completed_successfully
    networks:
      - internal

  auth:
    image: ibex-v1-auth:local
    build:
      context: ../../..
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    environment:
      IBEX_ENV: ${IBEX_ENV:-staging}
      IBEX_PORT: "8081"
      IBEX_GRPC_PORT: "9091"
      POSTGRES_DSN: postgres://ibex_auth:${IBEX_AUTH_DB_PASSWORD:?IBEX_AUTH_DB_PASSWORD is required; run make v1-secrets}@postgres:5432/${POSTGRES_DB:-ibex}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      IBEX_CREDENTIALS_MASTER_KEY: ${IBEX_CREDENTIALS_MASTER_KEY:?IBEX_CREDENTIALS_MASTER_KEY is required; run make v1-secrets}
      IBEX_AUTH_LIFECYCLE_TOKEN: ${IBEX_AUTH_LIFECYCLE_TOKEN:?IBEX_AUTH_LIFECYCLE_TOKEN is required; run make v1-secrets}
      IBEX_AUTH_ISSUE_TOKEN: ${IBEX_AUTH_ISSUE_TOKEN:?IBEX_AUTH_ISSUE_TOKEN is required; run make v1-secrets}
      JWT_ISSUER: ibex-harness
      JWT_AUDIENCE: ibex-dashboard
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
      IBEX_AUTH_POLICY_SIGNING_KEY_FILE: /run/secrets/policy_private.pem
      IBEX_AUTH_POLICY_SIGNING_KEY_ID: v1
      IBEX_AUTH_POLICY_EPOCH: "1"
      IBEX_AUTH_GRPC_TLS_CERT_FILE: /run/secrets/auth.crt
      IBEX_AUTH_GRPC_TLS_KEY_FILE: /run/secrets/auth.key
    secrets:
      - auth.crt
      - auth.key
      - jwt_private.pem
      - policy_private.pem
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      provision:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal

  proxy:
    build:
      context: ../../..
      dockerfile: services/proxy/Dockerfile
    restart: unless-stopped
    # Shares the edge network namespace so browser credentials travel only over
    # loopback (ADR-0097 §4). The edge dials 127.0.0.1:8080.
    network_mode: "service:edge"
    environment:
      IBEX_ENV: ${IBEX_ENV:-staging}
      IBEX_PORT: "8080"
      POSTGRES_DSN: postgres://ibex_runtime:${IBEX_RUNTIME_DB_PASSWORD:?IBEX_RUNTIME_DB_PASSWORD is required; run make v1-secrets}@postgres:5432/${POSTGRES_DB:-ibex}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      IBEX_AUTH_GRPC_ADDR: auth:9091
      IBEX_AUTH_GRPC_CA_FILE: /run/secrets/ca.crt
      IBEX_AUTH_VALIDATE_TIMEOUT: 2s
      # Staging/production require a policy-snapshot verifier when protected
      # routes are mounted. The key set is generated from AuthService's signing
      # public key (key id "v1").
      IBEX_PROXY_POLICY_PUBLIC_KEYS_FILE: /run/secrets/policy_public_keys.json
      IBEX_PROXY_POLICY_MIN_EPOCH: "1"
      IBEX_CONTEXT_ENABLED: "true"
      IBEX_CONTEXT_COLOCATED: "true"
      IBEX_CONTEXT_GRPC_TARGET: 127.0.0.1:9092
      IBEX_CONTEXT_GRPC_SERVICE_TOKEN: ${IBEX_CONTEXT_GRPC_SERVICE_TOKEN:?IBEX_CONTEXT_GRPC_SERVICE_TOKEN is required; run make v1-secrets}
      # CPU TEI query embedding cannot fit the 45 ms development budget. The
      # profile bounds assembly at 2 s; the chat path stays fail-open.
      IBEX_CONTEXT_ASSEMBLE_TIMEOUT: 2s
      IBEX_CONTEXT_EMBED_METADATA: "false"
      IBEX_WORKER_ENQUEUE_BASE_URL: http://worker:8007
      IBEX_WORKER_ENQUEUE_API_TOKEN: ${IBEX_WORKER_ENQUEUE_API_TOKEN:?IBEX_WORKER_ENQUEUE_API_TOKEN is required; run make v1-secrets}
      IBEX_LLM_MODE: ${IBEX_LLM_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    secrets:
      - ca.crt
      - policy_public_keys.json
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      provision:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      edge:
        condition: service_started

  api:
    build:
      context: ../../..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    # Shares the edge network namespace so the session cookie crosses loopback
    # only. The edge dials 127.0.0.1:8010.
    network_mode: "service:edge"
    # The image CMD binds 0.0.0.0; bind loopback so only the edge namespace
    # (the edge and console) can reach the API.
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8010"]
    environment:
      IBEX_ENV: ${IBEX_ENV:-staging}
      IBEX_API_HOST: 127.0.0.1
      IBEX_API_PORT: "8010"
      IBEX_API_DATABASE_URL: postgresql+asyncpg://ibex_runtime:${IBEX_RUNTIME_DB_PASSWORD:?IBEX_RUNTIME_DB_PASSWORD is required; run make v1-secrets}@postgres:5432/${POSTGRES_DB:-ibex}
      IBEX_AUTH_GRPC_ADDR: auth:9091
      IBEX_AUTH_GRPC_CA_FILE: /run/secrets/ca.crt
      IBEX_AUTH_LIFECYCLE_TOKEN: ${IBEX_AUTH_LIFECYCLE_TOKEN:?IBEX_AUTH_LIFECYCLE_TOKEN is required; run make v1-secrets}
      IBEX_AUTH_ISSUE_TOKEN: ${IBEX_AUTH_ISSUE_TOKEN:?IBEX_AUTH_ISSUE_TOKEN is required; run make v1-secrets}
      IBEX_API_AUTH_TIMEOUT_MS: "2000"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      # Organization deletion is enqueued through the worker's broker DB.
      IBEX_API_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
      IBEX_ALLOWED_ORIGINS: ${IBEX_ALLOWED_ORIGINS:?IBEX_ALLOWED_ORIGINS is required; run make v1-secrets}
      DASHBOARD_JWT_PUBLIC_KEYS_FILE: /run/secrets/jwt_public.pem
      JWT_ISSUER: ibex-harness
      JWT_AUDIENCE: ibex-dashboard
      IBEX_OPERATOR_CURSOR_SECRET: ${IBEX_OPERATOR_CURSOR_SECRET:?IBEX_OPERATOR_CURSOR_SECRET is required; run make v1-secrets}
      DASHBOARD_CSRF_SECRET: ${DASHBOARD_CSRF_SECRET:?DASHBOARD_CSRF_SECRET is required; run make v1-secrets}
      DASHBOARD_COOKIE_SECURE: "true"
      DASHBOARD_COOKIE_SAMESITE: lax
      DASHBOARD_SESSION_COOKIE_NAME: ibex_session
      IBEX_OPERATOR_FEATURE_ENABLED: ${IBEX_OPERATOR_FEATURE_ENABLED:-true}
    secrets:
      - ca.crt
      - jwt_public.pem
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      provision:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      edge:
        condition: service_started

  memory:
    build:
      context: ../../..
      dockerfile: services/memory/Dockerfile
    restart: unless-stopped
    environment:
      IBEX_ENV: ${IBEX_ENV:-staging}
      IBEX_MEMORY_HOST: 0.0.0.0
      IBEX_MEMORY_PORT: "8005"
      IBEX_MEMORY_DATABASE_URL: postgresql+asyncpg://ibex_runtime:${IBEX_RUNTIME_DB_PASSWORD:?IBEX_RUNTIME_DB_PASSWORD is required; run make v1-secrets}@postgres:5432/${POSTGRES_DB:-ibex}
      IBEX_AUTH_GRPC_ADDR: auth:9091
      IBEX_AUTH_GRPC_CA_FILE: /run/secrets/ca.crt
      IBEX_MEMORY_AUTH_TIMEOUT_MS: "2000"
      IBEX_MEMORY_EMBEDDING_BASE_URL: http://embedder:8004
      IBEX_EMBEDDING_API_TOKEN: ${IBEX_EMBEDDING_API_TOKEN:?IBEX_EMBEDDING_API_TOKEN is required; run make v1-secrets}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    secrets:
      - ca.crt
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      auth:
        condition: service_healthy
      embedder:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
    networks:
      - internal

  embedder:
    build:
      context: ../../..
      dockerfile: services/embedder/Dockerfile
    restart: unless-stopped
    environment:
      IBEX_ENV: ${IBEX_ENV:-staging}
      IBEX_EMBEDDING_PROFILE: gpu
      IBEX_EMBEDDING_DIM: "1024"
      IBEX_EMBEDDING_MODEL: BAAI/bge-m3
      IBEX_EMBEDDING_TEI_BASE_URL: http://tei:80
      IBEX_EMBEDDING_TEI_ALLOW_INSECURE: "true"
      # bge-m3 first load is slow; the startup wait is separate from the /ready probe.
      IBEX_EMBEDDING_TEI_HEALTH_TIMEOUT_SECONDS: "600"
      IBEX_EMBEDDING_API_TOKEN: ${IBEX_EMBEDDING_API_TOKEN:?IBEX_EMBEDDING_API_TOKEN is required; run make v1-secrets}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      tei:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    restart: unless-stopped
    command:
      - "--model-id=BAAI/bge-m3"
      - "--revision=5617a9f61b028005a4858fdac845db406aefb181"
      - "--dtype=float32"
      - "--port=80"
      # Single-node sizing: the default 8192-token batch / 512 concurrent
      # requests need more RAM than a 16 GB host has after the other services.
      # 2048 tokens still covers normal memory and query text.
      - "--max-batch-tokens=2048"
      - "--max-concurrent-requests=16"
    environment:
      HF_HOME: /data
      # The Xet client is markedly slower than the classic LFS path on some
      # networks. The model is downloaded once into the persistent volume.
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - tei-cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health >/dev/null"]
      interval: 10s
      timeout: 5s
      # First start downloads ~2.3 GB and loads a CPU ONNX model. The window is
      # deliberately generous: a slow host must not be marked unhealthy while
      # the model is still downloading or loading.
      retries: 360
      start_period: 7200s
    networks:
      - internal

  worker:
    build:
      context: ../../..
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    environment:
      IBEX_ENV: ${IBEX_ENV:-staging}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      REDIS_DB_QUEUE: "1"
      REDIS_DB_RESULTS: "3"
      POSTGRES_DSN: postgres://ibex_worker:${IBEX_WORKER_DB_PASSWORD:?IBEX_WORKER_DB_PASSWORD is required; run make v1-secrets}@postgres:5432/${POSTGRES_DB:-ibex}?sslmode=disable
      IBEX_WORKER_METRICS_PORT: "8006"
      IBEX_WORKER_ENQUEUE_PORT: "8007"
      IBEX_WORKER_ENQUEUE_HOST: 0.0.0.0
      IBEX_WORKER_ENQUEUE_API_TOKEN: ${IBEX_WORKER_ENQUEUE_API_TOKEN:?IBEX_WORKER_ENQUEUE_API_TOKEN is required; run make v1-secrets}
      IBEX_WORKER_MEMORY_BASE_URL: http://memory:8005
      IBEX_WORKER_MEMORY_API_TOKEN: ${IBEX_MEMORY_API_TOKEN:?IBEX_MEMORY_API_TOKEN is required; run make v1-secrets}
      IBEX_ORG_DELETION_DEPLOYED_STORES: postgres,redis
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      # /ready proves the enqueue server, ledger, and broker; the Celery ping
      # adds the consumer for the extraction queue.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/ready', timeout=3)\" && celery -A app.celery_app:celery_app inspect ping -t 2 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      # provision already implies migrate (its own edge), but the explicit edge is
      # kept: this change only adds the credential gate, it does not rewrite the
      # ordering the worker already relied on.
      migrate:
        condition: service_completed_successfully
      provision:
        condition: service_completed_successfully
      memory:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    networks:
      - internal

  # Context assembly shares the edge network namespace with the proxy and binds
  # 127.0.0.1:9092 only (ADR-0096/ADR-0097 §4). It has no ports and no network of
  # its own; the edge namespace owns the only published port.
  context:
    build:
      context: ../../..
      dockerfile: services/context/Dockerfile
    restart: unless-stopped
    network_mode: "service:edge"
    environment:
      IBEX_CONTEXT_GRPC_ADDR: 127.0.0.1:9092
      IBEX_CONTEXT_MEMORY_BASE_URL: http://memory:8005
      IBEX_CONTEXT_MEMORY_API_TOKEN: ${IBEX_MEMORY_API_TOKEN:?IBEX_MEMORY_API_TOKEN is required; run make v1-secrets}
      IBEX_CONTEXT_GRPC_SERVICE_TOKEN: ${IBEX_CONTEXT_GRPC_SERVICE_TOKEN:?IBEX_CONTEXT_GRPC_SERVICE_TOKEN is required; run make v1-secrets}
      # Keep server-side retrieval inside the proxy's 2 s client budget. The
      # cold branch embeds the query through CPU TEI, so it dominates.
      IBEX_CONTEXT_TIMEOUT: 1800ms
      IBEX_CONTEXT_DEADLINE_MS: "1800"
      IBEX_CONTEXT_DIRECTIVE_TIMEOUT_MS: "500"
      IBEX_CONTEXT_HOT_TIMEOUT_MS: "500"
      IBEX_CONTEXT_COLD_TIMEOUT_MS: "1500"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    healthcheck:
      # Standard grpc.health.v1 check against the empty (server-wide) service.
      # grpcio-health-checking is a context image dependency.
      test: ["CMD-SHELL", "python -c \"import grpc,sys; from grpc_health.v1 import health_pb2, health_pb2_grpc; c=grpc.insecure_channel('127.0.0.1:9092'); r=health_pb2_grpc.HealthStub(c).Check(health_pb2.HealthCheckRequest(), timeout=3); sys.exit(0 if r.status==health_pb2.HealthCheckResponse.SERVING else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      proxy:
        condition: service_started
      memory:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
      edge:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  console:
    build:
      context: ../../..
      dockerfile: services/console/Dockerfile
    restart: unless-stopped
    # Shares the edge network namespace: the BFF reaches the edge on loopback and
    # the edge reaches the console on loopback, so the session cookie never
    # crosses the bridge (ADR-0097 §4).
    network_mode: "service:edge"
    environment:
      # The edge listens on 8443 *inside* the shared namespace; IBEX_EDGE_PORT is
      # only the host-side mapping (e.g. 443 -> 8443) and is not a listener here.
      # The BFF must dial https://localhost:8443. The browser keeps using
      # https://localhost:${IBEX_EDGE_PORT}; the edge certificate carries
      # DNS:localhost and the BFF trusts the per-install CA.
      IBEX_OPERATOR_API_ORIGIN: https://localhost:8443
      IBEX_OPERATOR_API_INTERNAL_ORIGIN: http://127.0.0.1:8010
      IBEX_OPERATOR_SESSION_COOKIE_NAME: ibex_session
      NUXT_PUBLIC_IBEX_ENV: ${NUXT_PUBLIC_IBEX_ENV:-self-hosted}
      NODE_EXTRA_CA_CERTS: /run/secrets/ca.crt
      HOST: 0.0.0.0
      PORT: "3000"
    secrets:
      - ca.crt
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      edge:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  edge:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /config
      - /data
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
    secrets:
      - edge.crt
      - edge.key
      - ca.crt
    ports:
      - "${IBEX_EDGE_PORT:-443}:8443"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert /run/secrets/ca.crt https://127.0.0.1:8443/_edge/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

secrets:
  auth.crt:
    file: ./secrets/auth.crt
  auth.key:
    file: ./secrets/auth.key
  ca.crt:
    file: ./secrets/ca.crt
  edge.crt:
    file: ./secrets/edge.crt
  edge.key:
    file: ./secrets/edge.key
  jwt_private.pem:
    file: ./secrets/jwt_private.pem
  jwt_public.pem:
    file: ./secrets/jwt_public.pem
  policy_private.pem:
    file: ./secrets/policy_private.pem
  policy_public_keys.json:
    file: ./secrets/policy_public_keys.json

volumes:
  postgres-data:
  redis-data:
  tei-cache:
  objectstore-data:

networks:
  internal:
    name: ibex-v1-single-node-internal
