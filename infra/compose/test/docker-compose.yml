# Minimal stack for integration tests (Postgres + Redis + ClickHouse).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ibex
      POSTGRES_PASSWORD: ibex
      POSTGRES_DB: ibex_test
      # HNSW build / incremental insert — give the container headroom on developer hosts.
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5433:5432"
    shm_size: "3gb"
    # Docker Desktop VM raised to ~8GiB for HNSW benches on this host.
    mem_limit: 6g
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - work_mem=64MB
      - -c
      - max_parallel_maintenance_workers=2
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - synchronous_commit=off
      - -c
      - wal_buffers=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - dynamic_shared_memory_type=posix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibex -d ibex_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack:7.4.0-v1
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    environment:
      CLICKHOUSE_DB: ibex
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports:
      - "8124:8123"
      - "9003:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
