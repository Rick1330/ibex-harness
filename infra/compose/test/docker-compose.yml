# Minimal stack for integration tests (Postgres + Redis + ClickHouse).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ibex
      POSTGRES_PASSWORD: ibex
      POSTGRES_DB: ibex_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibex -d ibex_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack:7.4.0-v1
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    environment:
      CLICKHOUSE_DB: ibex
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports:
      - "8124:8123"
      - "9003:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
