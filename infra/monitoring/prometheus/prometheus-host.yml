global:
  scrape_interval: 10s
  evaluation_interval: 10s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8080"]
  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8081"]
  - job_name: embedder
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8004"]
  - job_name: mcp-memory
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8090"]
  - job_name: memory
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8005"]
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8006"]
