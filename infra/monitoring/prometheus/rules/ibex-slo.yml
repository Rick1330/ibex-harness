# IBEX proxy enforcement-overhead SLO — recording rules and multi-window burn alerts (W6.3).
#
# Objective (ratified, single source of truth):
#   engineering/architecture-v2/05-request-lifecycle-and-slos.md §Timing policy
#   p99 ≤ 20 ms of proxy enforcement overhead, for the warm mock-provider
#   local/protected profile, context assembly disabled. It excludes provider
#   time, post-header stream time, cold caches, and hosted/reference performance.
# That document is the only place the number is allowed to change; this file
# encodes it and does not originate it.
#
# POPULATION CONTRACT — stated once here; every expression below obeys it
# ----------------------------------------------------------------------
# The ratified objective measures the proxy with context assembly DISABLED. The
# histogram carries an `assembly` label, so the population is selected
# explicitly and never inferred from "the only series that exists":
#
#   ibex_proxy_overhead_seconds{assembly="disabled"}   THE SLO POPULATION.
#       Context assembly did not run; every request here is graded by this
#       objective.
#   ibex_proxy_overhead_seconds{assembly="enabled"}    NOT the SLO population.
#       Context assembly ran, so this request's overhead legitimately includes
#       the Context Assemble RPC. That is a different workload with its own
#       (unratified) target. Mixing it in raises the p99 for a reason the
#       objective does not cover — it would page an operator about a feature
#       being switched on, and it would hide a real regression behind a
#       workload the ratified number never described.
#
# Every selector below carries assembly="disabled": both the _count and the
# _bucket term of each bad-share ratio, every recording rule, both burn alerts,
# the p99 quantiles, and the absence alert. Infra/scripts/slo-rules-check.sh
# re-derives that from this file and rejects any selector that omits it (with a
# self-mutation proving the check can fail), so the population cannot drift back
# into "whatever the histogram happens to record".
#
# Two metrics, one population:
#   ibex_proxy_overhead_seconds{assembly}            the SLI histogram, observed
#       once per completed non-streaming request.
#   ibex_proxy_nonstreaming_requests_total{assembly} eligible non-streaming
#       requests, incremented once per observed request (same call, same
#       population). It is the "there is traffic" term of the absence alert
#       below: without it, "no observations" and "nothing to observe" are
#       indistinguishable.
# Streaming requests are observed by neither metric and are not represented
# here — a coverage limit, not a claim.
#
# The bad-share expressions below need 20 ms to be a bucket boundary, so they
# select the 20 ms bucket directly. The histogram is wired to
# ProxyEnforcementBuckets (packages/metrics/buckets.go), whose Go literal is
# 0.020 — but the label Prometheus stores is the *rendered* form of that float,
# le="0.02", because client_golang formats the bound with
# strconv.FormatFloat(bound, 'g', -1, 64). The two strings are not
# interchangeable: a selector quoting the Go literal matches no series at all,
# every ratio below becomes an empty vector, both burn alerts go silent, and
# IbexProxyOverheadSLIAbsent stays quiet too because _count still exists. The
# p99 recording rules keep working, so the dashboards look healthy while nothing
# pages — the reason this file states the rendered label and not the literal.
#
# infra/scripts/slo-rules-check.sh renders the family's bounds exactly as the
# client does (and cross-checks that rendering against the real client encoder),
# then asserts every le= selector in this file exists in that rendered set, so
# the mismatch is caught at build time instead of at 03:00.
#
# Deliberately NOT alerted here: the context-assembly p95 ≤50 ms / p99 ≤100 ms
# values and the memory-retrieval targets. engineering/architecture-v2/
# 05-request-lifecycle-and-slos.md classifies them as targets pending a
# workload-qualified measurement, and the context RPC 40 ms value as an internal
# client deadline. Encoding an unratified number as a burn alert would invent an
# SLO and page an operator over a threshold nobody agreed to. The proxy now also
# records ibex_proxy_context_assemble_seconds (target p95 ≤50 ms, unratified),
# so the metric exists for a dashboard; it gets a rule when the number is
# ratified, not before. That target is also why the assembly="enabled"
# population above is excluded rather than graded: it is unratified, so the
# ratified number cannot be stretched to cover it.
#
# Burn maths
# ----------
# Objective 99% ⇒ the error budget is the 1% of requests allowed over 20 ms.
#   burn rate = (share of requests over 20 ms) / 0.01
# A burn rate of 1 spends the budget evenly over the SLO window; a rate of N
# spends it N times faster. The multipliers are the standard multi-window ones
# for a 99% objective, not tuning knobs:
#   14.4x over 1h burns 2% of the budget in one hour (1h × 14.4 / 720h = 2%).
#    6x   over 6h burns 5% of the budget in six hours (6h × 6 / 720h = 5%).
# Both windows of a pair must breach before the alert fires, so a single scrape
# spike, a deploy window, or a short burst cannot page on its own: the long
# window proves the burn is sustained, the short window proves it is still
# happening and the alert resolves promptly when it stops. The 5m-only burst is
# covered in rules/test/unit/ibex-slo-burn.test.yml ("brief-burst...").
#
# Cost: the histogram is labelled by assembly only (one series per bucket per
# population, 13 buckets), so the widest window below — 6h — scans 2160 samples
# per bucket at a 10s scrape, per evaluation. That is a deliberate trade: the
# long window is what makes a slow burn visible, and a single low-cardinality
# label keeps it cheap. Do not add a per-request label to this histogram for a
# dashboard: it multiplies this cost and moves work onto the proxy hot path.
#
# Every alert here carries a routing `severity` label (`page`/`ticket`, checked
# by infra/scripts/check-alert-routing.py) and a `summary` + `runbook` annotation
# (checked by infra/scripts/slo-rules-check.sh).

groups:
  - name: ibex.slo.proxy_overhead
    rules:
      # --- The SLI, as published for dashboards and API queries --------------
      # p99 by histogram_quantile over the aggregated bucket set: the single
      # number the ratified objective names, over a short and a long window.
      # Population: assembly="disabled" (see POPULATION CONTRACT).
      - record: ibex:proxy_overhead_seconds:p99_5m
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(ibex_proxy_overhead_seconds_bucket{assembly="disabled"}[5m]))
          )

      - record: ibex:proxy_overhead_seconds:p99_1h
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(ibex_proxy_overhead_seconds_bucket{assembly="disabled"}[1h]))
          )

      # --- Bad-event share at the 20 ms boundary -----------------------------
      # Requests over 20 ms = total count - observations in the 20 ms bucket,
      # selected as le="0.02" (the rendered form of the 0.020 Go literal).
      # clamp_min keeps a scrape gap (count rate 0) from producing NaN:
      # a zero-traffic window reports a 0 share, never a division artefact.
      # Both terms of every ratio pin assembly="disabled"; a ratio that pinned
      # only one would divide one population by the other.
      - record: ibex:sli_proxy_overhead:bad_ratio_5m
        expr: |
          (
            sum(rate(ibex_proxy_overhead_seconds_count{assembly="disabled"}[5m]))
            - sum(rate(ibex_proxy_overhead_seconds_bucket{assembly="disabled",le="0.02"}[5m]))
          )
          / clamp_min(sum(rate(ibex_proxy_overhead_seconds_count{assembly="disabled"}[5m])), 1e-9)

      - record: ibex:sli_proxy_overhead:bad_ratio_1h
        expr: |
          (
            sum(rate(ibex_proxy_overhead_seconds_count{assembly="disabled"}[1h]))
            - sum(rate(ibex_proxy_overhead_seconds_bucket{assembly="disabled",le="0.02"}[1h]))
          )
          / clamp_min(sum(rate(ibex_proxy_overhead_seconds_count{assembly="disabled"}[1h])), 1e-9)

      - record: ibex:sli_proxy_overhead:bad_ratio_30m
        expr: |
          (
            sum(rate(ibex_proxy_overhead_seconds_count{assembly="disabled"}[30m]))
            - sum(rate(ibex_proxy_overhead_seconds_bucket{assembly="disabled",le="0.02"}[30m]))
          )
          / clamp_min(sum(rate(ibex_proxy_overhead_seconds_count{assembly="disabled"}[30m])), 1e-9)

      - record: ibex:sli_proxy_overhead:bad_ratio_6h
        expr: |
          (
            sum(rate(ibex_proxy_overhead_seconds_count{assembly="disabled"}[6h]))
            - sum(rate(ibex_proxy_overhead_seconds_bucket{assembly="disabled",le="0.02"}[6h]))
          )
          / clamp_min(sum(rate(ibex_proxy_overhead_seconds_count{assembly="disabled"}[6h])), 1e-9)

      # --- Burn rate for each window (bad share / 1% budget) -----------------
      # Recorded so the alert expressions read as the comparison they are, and
      # so an operator can graph the same quantity the alert evaluates. The
      # population is already pinned inside the ratio, so nothing is re-filtered
      # here: filtering twice would be one more place to get it wrong.
      - record: ibex:sli_proxy_overhead:burn_rate_5m
        expr: ibex:sli_proxy_overhead:bad_ratio_5m / 0.01

      - record: ibex:sli_proxy_overhead:burn_rate_1h
        expr: ibex:sli_proxy_overhead:bad_ratio_1h / 0.01

      - record: ibex:sli_proxy_overhead:burn_rate_30m
        expr: ibex:sli_proxy_overhead:bad_ratio_30m / 0.01

      - record: ibex:sli_proxy_overhead:burn_rate_6h
        expr: ibex:sli_proxy_overhead:bad_ratio_6h / 0.01

      # --- Burn alerts -------------------------------------------------------
      # Fast burn: 14.4x on both the 1h and the 5m window. Roughly 2% of the
      # budget per hour, which is a deploy-scale regression, so it pages.
      - alert: IbexProxyOverheadFastBurn
        expr: |
          ibex:sli_proxy_overhead:burn_rate_1h > 14.4
          and
          ibex:sli_proxy_overhead:burn_rate_5m > 14.4
        for: 2m
        labels:
          severity: page
          service: proxy
          slo: proxy_overhead_p99_20ms
        annotations:
          summary: "Proxy overhead burn rate is 14.4x the 99% / 20 ms error budget"
          description: >-
            More than 14.4% of proxy requests exceeded the 20 ms enforcement-overhead
            budget over both the last hour and the last five minutes, which spends
            about 2% of a 30-day error budget per hour. Measured over the ratified
            population only (assembly="disabled"): requests that also ran context
            assembly are excluded, and the SLI excludes provider time and
            post-header stream time, so neither the provider nor a deliberate
            context-assembly rollout is the cause. Current burn rate:
            ibex:sli_proxy_overhead:burn_rate_1h.
          runbook: "engineering/runbooks/RUNBOOKS.md section 2 (Proxy high p99 overhead)"

      # Slow burn: 6x on both the 6h and the 30m window. Roughly 5% of the
      # budget per six hours — a regression that will exhaust the budget within
      # days but has no single bad minute, so it is queued, not paged.
      - alert: IbexProxyOverheadSlowBurn
        expr: |
          ibex:sli_proxy_overhead:burn_rate_6h > 6
          and
          ibex:sli_proxy_overhead:burn_rate_30m > 6
        for: 15m
        labels:
          severity: ticket
          service: proxy
          slo: proxy_overhead_p99_20ms
        annotations:
          summary: "Proxy overhead burn rate is 6x the 99% / 20 ms error budget (slow burn)"
          description: >-
            More than 6% of proxy requests exceeded the 20 ms enforcement-overhead
            budget over both the last six hours and the last thirty minutes, which
            spends about 5% of a 30-day error budget per six hours. Measured over
            the ratified population only (assembly="disabled"). No single window is
            dramatic, so this is queued rather than paged. Current burn rate:
            ibex:sli_proxy_overhead:burn_rate_6h.
          runbook: "engineering/runbooks/RUNBOOKS.md section 2 (Proxy high p99 overhead)"

      # The alert above every burn alert: an SLI that is not being recorded
      # cannot burn, so silence here is indistinguishable from health.
      #
      # It fires on either way the SLI can stop being measurable while eligible
      # traffic exists, because `absent()` alone only catches the first:
      #
      #   1. the series is missing — the histogram family unregistered or
      #      renamed, the scrape filter dropped it, the build never exports it;
      #   2. the histogram's cumulative `_count` is present but not advancing
      #      while the traffic counter does advance. `_count` exists, so every
      #      ratio computes 0/0, both burn alerts stay quietly healthy, and
      #      `absent()` can never see it — exactly the regression that hides the
      #      SLO for weeks.
      #
      # The first term is `absent(...) or rate(...) == 0` for those two cases.
      # The second term is the traffic guard, and it is a lane-specific counter:
      # ibex_proxy_nonstreaming_requests_total{assembly="disabled"} counts the
      # requests this SLO is meant to grade, so streaming traffic (which the
      # histogram never observes) cannot make an idle SLI look loaded, and the
      # count moving while the histogram does not is the instrumentation
      # signature itself. Without the guard, an idle stack would raise a
      # permanent ticket ("the SLO is unmonitored") that says nothing; a proxy
      # that is simply not running is already covered by IbexProxyDown.
      # Ticket severity: the fix is instrumentation, not incident response.
      #
      # Residual limit, stated so nobody reads more into silence than is there:
      # the counter and the observation are incremented in one call, so a change
      # that removes the whole call freezes both and looks like an idle stack.
      # This alert deliberately covers the histogram-side regression it can
      # prove; a stopped proxy is IbexProxyDown, and the request-path SLOs cover
      # traffic that arrives but is not served.
      #
      # Label matching: absent() applied to a selector keeps that selector's
      # equality matchers, so this alert instance carries assembly="disabled" —
      # which names the population whose instrumentation went missing. The
      # `and` is a set intersection on the labels both terms share, so exactly
      # one instance fires; there is no per-population fan-out.
      - alert: IbexProxyOverheadSLIAbsent
        expr: |
          (
            absent(ibex_proxy_overhead_seconds_count{assembly="disabled"})
            or
            rate(ibex_proxy_overhead_seconds_count{assembly="disabled"}[10m]) == 0
          )
          and
          (rate(ibex_proxy_nonstreaming_requests_total{assembly="disabled"}[10m]) > 0)
        for: 15m
        labels:
          severity: ticket
          service: proxy
          slo: proxy_overhead_p99_20ms
        annotations:
          summary: "Proxy overhead SLI is missing or not advancing while non-streaming requests are served"
          description: >-
            Non-streaming requests are being served with context assembly disabled,
            but ibex_proxy_overhead_seconds_count{assembly="disabled"} has either had
            no series for 15m or is present and not advancing, so both burn alerts
            above are silently inert. Check that the proxy scrapes (up{job="proxy"}),
            that the build registers and observes ibex_proxy_overhead_seconds on the
            assembly="disabled" path, that ibex_proxy_nonstreaming_requests_total
            shares that population, and that 0.02 is still the rendered label of the
            20 ms bucket in the family wired to that histogram (the Go literal is
            0.020; Prometheus stores the formatted float).
          runbook: "infra/monitoring/prometheus/rules/ibex-slo.yml (header: population contract, SLI metric and bucket precondition)"
